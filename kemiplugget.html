{ej:true,id:"forr",nr:1,sym:"Kf",kap:1,title:"Kemi förr och nu",pages:"s. 10–17",
 intro:"Vad kemi är, hur människor har tänkt om ämnen genom historien och hur forskare arbetar i dag. Här ingår också granskningen av slagrutan.",
 el:{s:"Au",n:"Guld",z:79,f:"Alkemisterna försökte göra guld av andra metaller men lyckades aldrig. Guld är ett grundämne och kan inte tillverkas med vanliga kemiska reaktioner."},letter:"",
 cards:[
  {t:"Kemi",d:"Läran om olika ämnens egenskaper, uppbyggnad och deras reaktioner med varandra. Kemi är en naturvetenskap."},
  {t:"Kemiska ämnen",d:"Finns överallt: vatten, luft, växter, mat och kläder är olika kombinationer och blandningar av kemiska ämnen. Även smaker och lukter orsakas av kemiska ämnen."},
  {t:"Grön kemi",d:"När kemister försöker hitta tillverkningsprocesser som är energisnåla och inte ger utsläpp som skadar miljön."},
  {t:"Khems",d:"Ett egyptiskt ord för något magiskt. Ämnena som användes vid balsamering kallades khems. Man tror att ordet <i>kemi</i> kommer därifrån.<br><small>Psst! Hemliga labbet gillar egyptiska ord.</small>"},
  {t:"Balsamering",d:"För ca 3 000 år sedan i Egypten behandlades döda kroppar med olika ämnen och lindades i tygremsor av lin som doppats i vätskor från växter, för att kroppen inte skulle förstöras."},
  {t:"De fyra elementen",d:"De grekiska filosoferna Empedokles och Aristoteles (för ca 2 000 år sedan) trodde att naturen var uppbyggd av <b>luft, jord, eld och vatten</b>. De tänkte och drog slutsatser men gjorde inga experiment. Idén levde kvar till slutet av 1700-talet."},
  {t:"Alkemi",d:"Föregångaren till dagens moderna vetenskap. Alkemisterna försökte göra guld av andra metaller och ett livselixir. De lyckades inte, men upptäckte nya ämnen (t.ex. syror), nya grundämnen och utvecklade arbetsmetoder som kemister använder än i dag.<br><small>Psst! Guldets kemiska tecken öppnar något i hemliga labbet.</small>"},
  {t:"Livselixir",d:"Ett ämne som alkemisterna försökte framställa. Det skulle bota alla sjukdomar och göra att man levde längre. I dag vet vi att det inte finns något sådant ämne."},
  {t:"Observation",d:"Något forskaren har sett och vill kunna förklara. Ofta börjar en undersökning med en observation."},
  {t:"Hypotes",d:"En idé till en förklaring. En hypotes måste kunna testas med en undersökning."},
  {t:"Undersökning",d:"Ett planerat test (experiment) för att ta reda på om hypotesen stämmer. Man ska vara noggrann och föra anteckningar över hur man gör och vad man observerar."},
  {t:"Resultat",d:"Det man får fram i undersökningen, t.ex. att ullens vikt minskade efter tvätten."},
  {t:"Slutsats",d:"Det man kommer fram till när man har tolkat resultatet och funderat över andra möjliga förklaringar. Till exempel att hypotesen faktiskt var korrekt."},
  {t:"Naturvetenskapligt arbetssätt",d:"Att testa idéer systematiskt: observation → hypotes → undersökning → resultat → slutsats. Undersökningarna dokumenteras och delas med andra forskare som kan granska dem. Arbetssättet började användas på 1600–1700-talen."},
  {t:"Alexander Fleming",d:"Skotsk bakteriolog som 1928 upptäckte penicillinet, egentligen av en slump. Biokemister utvecklade det sedan till ett läkemedel. Han fick Nobelpriset."},
  {t:"Slagruta",d:"En Y-formad grenklyka (helst av sälg) som slagrutegängare säger att de hittar vatten med. Idéerna om jordstrålning och currylinjer går inte att testa och bevisa, så det är <b>inte</b> naturvetenskap."}
 ],
 qs:[
  {k:"kan",q:"Ge exempel på olika områden som kemister kan arbeta med.",a:"<ul><li>Utveckla nya, bättre och miljövänligare material.</li><li>Hitta energisnåla tillverkningsprocesser utan skadliga utsläpp (grön kemi).</li><li>Läkemedelsindustrin.</li><li>Kriminologi: analysera bevis från brottsplatser.</li></ul><p>Kemister jobbar ofta i team med biologer, läkare och tekniker.</p>"},
  {k:"kan",q:"Vilken nytta har vi i dag av alkemisternas kunskaper?",a:"<p>De framställde nya ämnen, t.ex. syror, och upptäckte flera nya grundämnen. Framför allt utvecklade de arbetsmetoder i sina laboratorier som kemister fortfarande använder.</p>"},
  {k:"kan",q:"Vad är ett naturvetenskapligt arbetssätt?",a:"<p>Att testa idéer systematiskt. Man gör en observation, ställer upp en hypotes, planerar och genomför en undersökning, tolkar resultatet och drar en slutsats. Allt dokumenteras så att andra kan granska det.</p>"},
  {k:"kan",q:"Varför ska en forskare dokumentera sina undersökningar?",a:"<p>Så att andra forskare kan granska undersökningen, upprepa den och rätta den om det blivit fel. Då kan man också göra fler undersökningar som ger mer kunskap. Anteckningarna visar exakt hur man gjorde och vad man observerade.</p>"},
  {k:"kan",q:"Varifrån tror man att ordet kemi kommer?",a:"<p>Från det egyptiska ordet <b>khems</b> som betydde något magiskt. Ämnena som användes vid balsamering kallades khems.</p>"},
  {k:"kan",q:"Hur skilde sig de grekiska filosofernas sätt att förklara naturen från dagens forskares?",a:"<p>Grekerna tittade på naturen, funderade och drog slutsatser, men gjorde <b>inga experiment</b>. De tyckte att det räckte med tankar och idéer. Dagens forskare testar sina idéer med undersökningar.</p>"},
  {k:"fund",q:"Beskriv skillnaden mellan hur alkemisterna arbetade och hur en kemist arbetar i dag.",a:"<p>Alkemisterna provade sig fram för att göra guld och livselixir utan att systematiskt testa hypoteser. En kemist i dag arbetar systematiskt: hypotes, noggrant planerade experiment, dokumentation och kritiskt tänkande kring resultatet. Kemister har också ett gemensamt kemispråk med namn, symboler och formler.</p>"},
  {k:"fund",q:"Varför klarade inte alkemisterna att framställa guld från andra grundämnen?",a:"<p>Guld är ett grundämne. Det består av en enda sorts atomer, och man kan inte göra om ett grundämne till ett annat med vanliga kemiska metoder. Först på 1980-talet lyckades en kemist med moderna metoder omvandla lite vismut till guld, men det var alldeles för dyrt för att löna sig.</p>"},
  {k:"fund",q:"Ullexperimentet: ull blir inte blöt när man stänker vatten på den. Vilken var hypotesen och hur testades den?",a:"<p><b>Hypotes:</b> ullen innehåller fett som stöter bort vatten.</p><p><b>Test 1:</b> ullen vägdes, sköljdes i ett lösningsmedel som tar bort fett, torkade och vägdes igen. Vikten hade minskat.</p><p><b>Test 2:</b> lösningsmedlet fick avdunsta. Kvar blev en klibbig beläggning som visade sig vara fett. Hypotesen var korrekt.</p>"},
  {k:"fund",q:"Slagruta: är det naturvetenskap? Argumentera för eller emot.",a:"<p>Nej. Påståendena om jordstrålning och currykryss går inte att testa och bevisa. Man måste <i>tro</i> på det för att det ska fungera, och slagrutan kan ge utslag för många olika saker. Små rörelser i slagrutan kan förklaras av omedvetna muskelrörelser i händerna. Naturvetenskap kräver idéer som kan prövas med undersökningar.</p>"},
  {k:"fund",q:"Slagrutor kan plötsligt röra sig lite. Vad kan det bero på?",a:"<p>Små, omedvetna rörelser i kroppen och händerna. Slagrutegängaren märker inte själv att hen rör sig, och det förs över till slagrutan.</p>"},
  {k:"tf",q:"Kemi handlar om olika ämnens egenskaper.",tf:true,why:"Kemi är läran om ämnens egenskaper, uppbyggnad och reaktioner."},
  {k:"tf",q:"Alkemisterna kunde framställa guld.",tf:false,why:"De försökte hårt men lyckades aldrig."},
  {k:"tf",q:"En hypotes måste kunna testas.",tf:true,why:"Annars kan man inte ta reda på om den stämmer."},
  {k:"tf",q:"Lukt och smak beror på kemiska ämnen.",tf:true,why:"Till exempel ger kemiska ämnen i tomater deras lukt och smak."},
  {k:"tf",q:"Empedokles och Aristoteles gjorde många experiment för att bevisa de fyra elementen.",tf:false,why:"De gjorde inga experiment. De tänkte och drog slutsatser."}
 ]},

{ej:true,id:"skolan",nr:2,sym:"Sä",kap:1,title:"Kemi i skolan",pages:"s. 18–23",
 intro:"Laborationsrapporten, säkerhetsregler, farosymboler och hur eld uppstår och släcks.",
 el:{s:"O",n:"Syre",z:8,f:"Syre är en av brandtriangelns tre delar. Ta bort syret, alltså kväv elden, så slocknar den."},letter:"",
 cards:[
  {t:"Laboration",d:"En undersökning i kemisalen där du följer en instruktion och ett naturvetenskapligt arbetssätt: du planerar, utför och iakttar. Skillnaden mot en forskare är att det i skolan oftast finns ett svar."},
  {t:"Laborationsrapport",d:"Så dokumenterar du en laboration: <b>1.</b> Rubrik <b>2.</b> Uppgift <b>3.</b> Materiel <b>4.</b> Utförande <b>5.</b> Resultat <b>6.</b> Felsökningar <b>7.</b> Slutsats och diskussion."},
  {t:"Felkälla",d:"Något som kan ha påverkat resultatet, t.ex. smutsiga redskap eller svårigheter att läsa av mätvärden."},
  {t:"Säkerhetsregler",d:"Följ lärarens instruktioner. Använd skyddsutrustning. Håll ordning. Lär dig farosymbolerna."},
  {t:"Skyddsutrustning",d:"Skyddsglasögon och skyddsförkläde eller labbrock. Sätt upp långt hår. Det är förbjudet att äta och dricka i labbsalen, och man tvättar alltid händerna efteråt."},
  {t:"Farosymbol",d:"Symbol på etiketten som informerar och varnar om att innehållet är farligt och visar hur du ska hantera ämnet."},
  {t:"Skadlig",svg:"skadlig",d:"Ämnet kan vara skadligt, t.ex. irritera hud och ögon eller vara skadligt om man får i sig det."},
  {t:"Hälsofarlig",svg:"halsofarlig",d:"Ämnet kan ge allvarliga hälsoskador på lång sikt, t.ex. skada organ."},
  {t:"Miljöfarlig",svg:"miljofarlig",d:"Ämnet är farligt för miljön, t.ex. för fiskar och andra vattenlevande djur. Får inte hällas ut i naturen."},
  {t:"Brandfarlig",svg:"brandfarlig",d:"Ämnet kan lätt börja brinna. Håll det borta från lågor och gnistor."},
  {t:"Frätande",svg:"fratande",d:"Ämnet kan fräta sönder hud, ögon och material."},
  {t:"Giftig",svg:"giftig",d:"Ämnet är giftigt och kan vara dödligt även i små mängder."},
  {t:"Explosiv",svg:"explosiv",d:"Ämnet kan explodera."},
  {t:"Oxiderande",svg:"oxiderande",d:"Ämnet kan få andra ämnen att brinna kraftigare, eller orsaka brand."},
  {t:"Brandtriangeln",d:"För att det ska bli eld måste det finnas <b>bränsle, syre och värme</b>. Saknas någon av delarna blir det ingen eld."},
  {t:"Bränsle",d:"Det som brinner. Fast (trä, stearin), flytande (bensin) eller gasformigt (gasol). Fasta och flytande bränslen brinner egentligen inte, utan de brännbara gaser som bildas när de värms."},
  {t:"Kyla",d:"Att släcka genom att sänka temperaturen, t.ex. med vatten. Då bildas inga brännbara gaser."},
  {t:"Kväva",d:"Att släcka genom att hindra syret från att nå bränslet, t.ex. med lock, brandfilt, pulver- eller kolsyresläckare eller skum."},
  {t:"Röja",d:"Att släcka genom att ta bort bränslet, t.ex. brandgator vid skogsbrand där man hugger ner och röjer bort träd."},
  {t:"Minnesregel vid brand",d:"<b>1.</b> Rädda <b>2.</b> Varna <b>3.</b> Larma 112 <b>4.</b> Släcka. Stäng dörrar och fönster så att röken inte sprids och syretillförseln minskar.<br><small>Psst! 112 är också en kod i hemliga labbet.</small>"}
 ],
 qs:[
  {k:"kan",q:"Vilka rubriker är bra att ha med i en laborationsrapport?",a:"<ol><li>Rubrik – vad heter laborationen?</li><li>Uppgift – syfte, frågeställning, hypoteser</li><li>Materiel – utrustning och kemikalier</li><li>Utförande – hur du gör, gärna med bilder</li><li>Resultat – vad hände? Tabeller och diagram</li><li>Felsökningar – vad kan ha påverkat resultatet?</li><li>Slutsats och diskussion</li></ol>"},
  {k:"kan",q:"Vilka säkerhetsföreskrifter bör du följa när du laborerar i kemi?",a:"<ul><li>Följ lärarens instruktioner och gör aldrig egna experiment utan att prata med läraren.</li><li>Använd skyddsutrustning (skyddsglasögon, förkläde/labbrock, sätt upp långt hår).</li><li>Håll ordning, läs etiketter, plocka undan och diska.</li><li>Lär dig farosymbolerna.</li><li>Ät och drick inte i labbsalen och tvätta händerna efteråt.</li></ul>"},
  {k:"kan",q:"Vilken säkerhetsutrustning bör finnas i en laborationssal?",a:"<p>Skyddsglasögon och skyddsförkläden eller labbrockar. Det ska också finnas utrustning för att släcka bränder, t.ex. brandfilt och brandsläckare, och speciella avfallskärl för kemikalier. Du ska veta var allt finns och hur det används.</p>"},
  {k:"symbol",svg:"brandfarlig",q:"Vad betyder farosymbolen?",opts:["Brandfarlig","Oxiderande","Explosiv","Frätande"],c:0,why:"En låga ovanför ett streck betyder brandfarlig. Oxiderande har en låga över en ring."},
  {k:"symbol",svg:"skadlig",q:"Vad betyder farosymbolen?",opts:["Giftig","Skadlig","Hälsofarlig","Miljöfarlig"],c:1,why:"Utropstecknet betyder skadlig."},
  {k:"symbol",svg:"halsofarlig",q:"Vad betyder farosymbolen?",opts:["Skadlig","Explosiv","Hälsofarlig","Giftig"],c:2,why:"Människan med en stjärna på bröstet betyder hälsofarlig."},
  {k:"symbol",svg:"giftig",q:"Vad betyder farosymbolen?",opts:["Frätande","Hälsofarlig","Miljöfarlig","Giftig"],c:3,why:"Dödskallen betyder giftig."},
  {k:"symbol",svg:"oxiderande",q:"Vad betyder farosymbolen?",opts:["Brandfarlig","Oxiderande","Explosiv","Skadlig"],c:1,why:"En låga över en ring betyder oxiderande."},
  {k:"symbol",svg:"fratande",q:"Vad betyder farosymbolen?",opts:["Frätande","Miljöfarlig","Giftig","Explosiv"],c:0,why:"Droppar som fräter på en yta och en hand betyder frätande."},
  {k:"kan",q:"Vad behövs för att eld ska uppstå?",a:"<p>Bränsle, syre och värme (brandtriangeln). Saknas någon av delarna blir det ingen eld.</p>"},
  {k:"kan",q:"Hur kan man släcka en eld?",a:"<p>Genom att ta bort någon av brandtriangelns delar:</p><ul><li><b>Kyla</b>: sänk temperaturen, t.ex. med vatten.</li><li><b>Kväva</b>: ta bort syret med lock, brandfilt, brandsläckare med pulver eller kolsyra, eller skum.</li><li><b>Röja</b>: ta bort bränslet, t.ex. brandgator i skogen.</li></ul>"},
  {k:"kan",q:"Varför ska man aldrig hälla vatten på brinnande olja?",a:"<p>Brinnande olja är mycket varmare än 100 °C, så vattnet kokar direkt och ger små ångexplosioner. Heta, brinnande fettdroppar kan stänka iväg, sprida elden och ge svåra brännskador. Kväv elden med ett tätt lock eller en filt i stället.</p>"},
  {k:"fund",q:"Beskriv hur man ska släcka elden om det börjar brinna när man friterar i olja.",a:"<p>Kväv elden: lägg ett tätt lock eller en brandfilt över kastrullen så att syret inte kommer åt. Stäng av värmen. Häll aldrig vatten på. Tänk på minnesregeln: rädda, varna, larma 112, släcka.</p>"},
  {k:"kan",q:"Varför brinner egentligen inte fasta och flytande bränslen?",a:"<p>Det finns för lite syre i kontakt med själva bränslet. När bränslet värms bildas brännbara gaser, och det är gaserna som blandas med luftens syre och brinner. Det syns när man blåser ut ett stearinljus och sätter en tändsticka strax ovanför: gaserna tar eld igen.</p>"},
  {k:"kan",q:"Vad är skillnaden mellan en laboration i skolan och en forskares undersökning?",a:"<p>I skolan finns det oftast ett svar på undersökningen. En forskare söker efter ny kunskap som ingen vet ännu.</p>"},
  {k:"klur",q:"Vem har rätt? Varför slocknar ett tänt ljus när man blåser på det?",opts:["A: Luften man andas ut innehåller koldioxid som kväver elden.","B: För att luften man blåser ut är kallare än lågan, man kyler.","C: Man blåser bort syret kring lågan.","D: Man blåser bort de brännbara gaserna."],c:3,why:"Det är gaserna från veken som brinner. När man blåser förs de brännbara gaserna bort från lågan (och lågan kyls lite). Man tillför ju luft med syre, så C stämmer inte, och utandningsluft innehåller fortfarande mycket syre."},
  {k:"tf",q:"Efter en laboration måste du tvätta händerna.",tf:true,why:"Det gör man alltid för att inte få i sig kemikalier."},
  {k:"tf",q:"I skolans kemisal finns inga farliga ämnen.",tf:false,why:"Ibland använder man frätande, brandfarliga eller giftiga ämnen."},
  {k:"tf",q:"Du kan hälla ut alla skolans kemikalier i vasken efter en laboration.",tf:false,why:"Vissa överblivna kemikalier måste samlas upp i speciella avfallskärl."},
  {k:"tf",q:"Du kan alltid släcka en eld genom att blåsa på den.",tf:false,why:"Ett ljus kan blåsas ut, men en större eld kan få mer syre och ta fart."},
  {k:"tf",q:"Bensin brinner utan syre.",tf:false,why:"All eld behöver syre."},
  {k:"tf",q:"En brandsläckare kan innehålla syre.",tf:false,why:"Brandsläckare innehåller pulver eller kolsyra som kväver elden. Syre skulle göra elden värre."},
  {k:"tf",q:"Vatten släcker en eld genom att sänka temperaturen.",tf:true,why:"Vattnet kyler bränslet så att inga brännbara gaser bildas."},
  {k:"tf",q:"Vatten släcker en eld genom att ta bort syret.",tf:true,why:"Det bildas mycket vattenånga som tränger undan syret. Vatten både kyler och kväver."}
 ]},

{id:"atomer",nr:3,sym:"At",kap:1,title:"Atomer, molekyler, grundämnen och kemiska föreningar",pages:"s. 24–32",
 intro:"Hur materia är uppbyggd, kemiska tecken och formler, periodiska systemet och avsnittet Giftfri miljö om kopparföreningar.",
 el:{s:"H",n:"Väte",z:1,f:"Universums vanligaste grundämne. En väteatom har bara en proton och en elektron."},letter:"M",
 cards:[
  {t:"Materia",d:"Allt som har massa och kan vägas: du själv, mobiltelefoner, kläder, stenar och även luft. Materia består av atomer."},
  {t:"Atom",d:"Mycket små partiklar som all materia består av. Det finns lite mer än hundra olika slags atomer. Ca 5 miljoner atomer får plats i rad på 1 mm."},
  {t:"Atomos",d:"Grekiska för <i>odelbar</i>. I den första atommodellen såg man atomen som en odelbar partikel. Ordet atom kommer härifrån."},
  {t:"Elementarpartiklar",d:"De partiklar som atomen är uppbyggd av: protoner, neutroner och elektroner."},
  {t:"Atomkärna",d:"Mitten av atomen. Den består av protoner och neutroner."},
  {t:"Proton",d:"Positivt laddad partikel i atomkärnan. Väger ca 2 000 gånger så mycket som en elektron. Antalet protoner avgör vilket grundämne det är."},
  {t:"Neutron",d:"Oladdad (neutral) partikel i atomkärnan. Väger ungefär lika mycket som en proton."},
  {t:"Elektron",d:"Negativt laddad partikel som rör sig runt kärnan. Väger så lite att man inte räknar med den när man talar om atomens vikt."},
  {t:"Atommodell",d:"En bild av hur atomen ser ut. Dalton 1803: liten partikel. Rutherford 1909: kärna omgiven av elektroner. Bohr 1913: elektroner kring kärnan som ett planetsystem. Schrödinger 1926: kärnan omges av ett elektronmoln."},
  {t:"Oladdad atom",d:"En atom har lika många elektroner som protoner. Laddningarna tar ut varandra, så den totala laddningen är noll."},
  {t:"Kemisk bindning",d:"Det som håller ihop atomerna. Man säger att atomerna är bundna till varandra."},
  {t:"Molekyl",d:"Två eller fler atomer som är bundna till varandra. Kan innehålla likadana eller olika slags atomer. En DNA-molekyl är uppbyggd av miljarder atomer."},
  {t:"Grundämne",d:"Ett ämne som bara består av ett enda slags atomer, t.ex. syre, väte, kväve, kol, koppar och bly. Det finns lite fler än hundra grundämnen."},
  {t:"Syrgas (O<sub>2</sub>)",d:"Syre förekommer i naturen som molekyler av två syreatomer. De är i gasform, därför säger man syrgas. Väte, kväve och klor finns också som molekyler."},
  {t:"Kemisk förening",d:"Ett ämne som består av två eller flera <b>olika</b> slags atomer, t.ex. vatten (H<sub>2</sub>O) och koldioxid (CO<sub>2</sub>). En kemisk förening har andra egenskaper än grundämnena den är uppbyggd av."},
  {t:"Kemiskt tecken",d:"En eller två bokstäver som förkortar grundämnets grekiska eller latinska namn. Första bokstaven är stor, den andra liten: Cu = koppar, men CU = en kolatom och en uranatom."},
  {t:"Jacob Berzelius",d:"Svensk kemist som på 1800-talet införde de kemiska tecknen som används över hela världen. Upptäckte bl.a. selen 1817."},
  {t:"Kemisk formel",d:"Visar vilka grundämnen som ingår och hur många atomer av varje slag. H<sub>2</sub>O: två väteatomer och en syreatom. 2H<sub>2</sub>O betyder två vattenmolekyler."},
  {t:"Periodiska systemet",d:"Dmitrij Mendelejevs ordning av alla grundämnen (1800-talet). Egenskaper återkommer regelbundet, periodiskt. Grundämnena står i ordning efter atomnummer."},
  {t:"Atomnummer",d:"Antalet protoner i atomkärnan. Ju fler protoner, desto tyngre atom och högre atomnummer. Atomnumret avgör var i periodiska systemet grundämnet står."},
  {t:"Period och grupp",d:"<b>Period</b> = en vågrät rad i periodiska systemet. <b>Grupp</b> = en lodrät kolumn. Grundämnen i samma grupp har liknande egenskaper."},
  {t:"Metaller, icke-metaller, halvmetaller",d:"En indelning av periodiska systemet som bygger på grundämnenas olika egenskaper."},
  {ej:1,t:"Kopparföreningar",d:"Koppar i berggrunden är ofarligt, men kopparföreningar som sprids (t.ex. kopparsulfat i vasken eller båtbottenfärg) skadar vattenlevande djur. I små mängder är koppar livsnödvändigt för oss."},
  {t:"Miljömärkt",d:"Produkter som inte innehåller skadliga ämnen. Som konsument kan du välja ekologiska och miljömärkta produkter."},  {t:"Atomens uppbyggnad",d:"Atomkärnan i mitten med protoner (+) och neutroner (0). Runt kärnan rör sig elektroner (−).<br>"+ATOM},
  {t:"Kemiska tecken att kunna",d:"<span class='mono'>H</span> väte · <span class='mono'>O</span> syre · <span class='mono'>C</span> kol · <span class='mono'>N</span> kväve · <span class='mono'>S</span> svavel · <span class='mono'>Fe</span> järn · <span class='mono'>Cu</span> koppar · <span class='mono'>Au</span> guld · <span class='mono'>Al</span> aluminium · <span class='mono'>Na</span> natrium · <span class='mono'>Cl</span> klor · <span class='mono'>He</span> helium"},
  {t:"Kemiska formler att kunna",d:"<span class='mono'>O<sub>2</sub></span> syrgas · <span class='mono'>H<sub>2</sub></span> vätgas · <span class='mono'>H<sub>2</sub>O</span> vatten · <span class='mono'>CO<sub>2</sub></span> koldioxid · <span class='mono'>CO</span> kolmonoxid · <span class='mono'>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></span> glukos/fruktos"},
  {t:"Massa",d:"Det man mäter när man väger något. All materia har massa, eftersom den består av atomer, och atomer har massa (även om den är ytterst liten)."}
 ],
 qs:[
  {k:"kan",q:"Vad heter de små partiklar som alla atomer är uppbyggda av och vilka laddningar har de?",a:"<p>Elementarpartiklar: <b>protoner</b> (positiva), <b>neutroner</b> (oladdade) och <b>elektroner</b> (negativa).</p>"},
  {k:"kan",q:"Vad skiljer en molekyl från en atom?",a:"<p>En atom är en enda partikel. En molekyl är två eller fler atomer som är bundna till varandra med kemiska bindningar.</p>"},
  {k:"kan",q:"Vad är det för skillnad på ett grundämne och en kemisk förening?",a:"<p>Ett grundämne består av bara ett slags atomer (t.ex. syre). En kemisk förening består av minst två olika slags atomer som är bundna till varandra (t.ex. vatten, H<sub>2</sub>O).</p>"},
  {k:"kan",q:"Vad är det för skillnad på kemiska formler och kemiska tecken?",a:"<p>Ett kemiskt tecken är symbolen för ett grundämne (t.ex. O, C, Cu). En kemisk formel beskriver ett ämne med kemiska tecken och siffror som visar hur många atomer av varje slag som ingår (t.ex. CO<sub>2</sub>).</p>"},
  {k:"kan",q:"Varför är den totala laddningen hos en atom noll?",a:"<p>Den har lika många elektroner (negativa) som protoner (positiva). Laddningarna tar ut varandra.</p>"},
  {k:"kan",q:"Varför räknar man inte med elektronerna när man talar om atomens vikt?",a:"<p>Elektronerna väger så otroligt lite. En proton eller neutron väger ca 2 000 gånger så mycket som en elektron.</p>"},
  {k:"kan",q:"Hur har bilden av atomen (atommodellen) förändrats över tid?",a:"<ul><li>Dalton 1803: atomen som en liten partikel.</li><li>Rutherford 1909: en kärna omgiven av elektroner.</li><li>Bohr 1913: elektronerna kretsar kring kärnan som ett planetsystem.</li><li>Schrödinger 1926: kärnan omges av ett elektronmoln.</li></ul>"},
  {k:"kan",q:"Vad betyder 2H<sub>2</sub>O?",a:"<p>Två vattenmolekyler. Varje molekyl har två väteatomer och en syreatom.</p>"},
  {k:"kan",q:"Vad avgör var i periodiska systemet ett grundämne står?",a:"<p>Antalet protoner i atomkärnan, alltså atomnumret.</p>"},
  {k:"kan",q:"Varför kallas Mendelejevs arbete för det periodiska systemet?",a:"<p>Han upptäckte att vissa egenskaper hos grundämnena återkommer regelbundet, periodiskt, när man ordnar dem efter vikt/atomnummer.</p>"},
  {k:"fyll",q:"Fyll i: Ett kemiskt tecken är en symbol för ett …",a:"<p><b>grundämne</b></p>"},
  {k:"fyll",q:"Fyll i: Den kemiska formeln CO<sub>2</sub> visar att molekylen innehåller … kolatom och … syreatomer.",a:"<p><b>en</b> kolatom och <b>två</b> syreatomer</p>"},
  {k:"fyll",q:"Fyll i: Periodiska systemet skapades av …",a:"<p><b>Dmitrij Mendelejev</b></p>"},
  {k:"fund",q:"Vilka av begreppen grundämne, kemisk förening, atom eller molekyl passar på: O<sub>2</sub>, NO, C och SO<sub>2</sub>?",a:"<ul><li>O<sub>2</sub>: grundämne och molekyl</li><li>NO: kemisk förening (och molekyl)</li><li>C: grundämne (en atom)</li><li>SO<sub>2</sub>: kemisk förening (och molekyl)</li></ul>"},
  {k:"fund",q:"Förklara varför vatten, som består av syre- och väteatomer, har andra egenskaper än syre och väte.",a:"<p>När atomerna binds ihop bildas en ny kemisk förening, och en kemisk förening har andra egenskaper än grundämnena den består av. Väte är explosivt och brandfarligt, syre gör att det brinner bättre, men vatten släcker eld.</p>"},
  {ej:1,k:"kan",q:"Hur kan ett naturligt ämne som koppar vara giftigt?",a:"<p>Koppar i berggrunden är gömd och sprids inte. Men när kopparföreningar sprids, t.ex. kopparsulfat i vasken eller koppar från båtbottenfärg, kommer de i kontakt med levande organismer. Många djur i vatten är mycket känsliga för koppar.</p>"},
  {ej:1,k:"kan",q:"Varför finns det olika regler för båtbottenfärg på östkusten och västkusten?",a:"<p>Östersjön är särskilt känsligt och redan förorenat. I det saltare vattnet på västkusten bildas mer påväxt, så där behövs färger med mer koppar. I Östersjön behövs inte den giftigare färgen, och den skulle göra större skada.</p>"},
  {ej:1,k:"fund",q:"Är ett giftigt ämne alltid giftigt och är det giftigt för allt och alla?",a:"<p>Nej. Det beror på mängden och vem som utsätts. Koppar är giftigt för många vattendjur, men i små mängder livsnödvändigt för människor: koppar behövs för ämnesomsättningen, immunförsvaret och för att blodet ska kunna transportera syre.</p>"},
  {ej:1,k:"fund",q:"Ge exempel på sätt att minska utsläpp av giftiga ämnen vid laborationer.",a:"<p>Använd små mängder kemikalier, häll aldrig kemikalier i vasken utan samla dem i avfallskärl, välj mindre farliga ämnen när det går och följ instruktionerna.</p>"},
  {k:"kan",q:"Varför försöker forskare ersätta oljebaserade ämnen?",a:"<p>Olja är inte förnybar och tar slut. Växtbaserade ämnen är miljövänligare. Dessutom är många tillsatser i produkter hälsofarliga.</p>"},
  {k:"tf",q:"CU betyder koppar.",tf:false,why:"Koppar skrivs Cu. CU betyder en kolatom och en uranatom."},
  {k:"tf",q:"En atom har alltid lika många protoner som elektroner.",tf:true,why:"Därför är atomen oladdad."},
  {k:"tf",q:"En molekyl kan innehålla likadana atomer.",tf:true,why:"Till exempel O<sub>2</sub>, en syremolekyl."},  {k:"fund",q:"Beskriv atomen. Rita en bild och jämför sedan med facit.",a:"<p>I mitten finns atomkärnan med positivt laddade <b>protoner</b> och oladdade <b>neutroner</b>. Runt kärnan rör sig negativt laddade <b>elektroner</b>. Atomen har lika många elektroner som protoner och är därför oladdad.</p>"+ATOM},
  {k:"kan",q:"Hur hänger begreppen materia, massa och atomer ihop?",a:"<p>Allt som har massa och kan vägas är materia, till och med luft. Materia består av atomer, och det är atomerna som ger materian dess massa.</p>"},
  {k:"tecken",q:"Vilket grundämne har tecknet <span class='mono'>O</span>?",opts:["Guld","Syre","Osmium","Kol"],c:1,why:"O = syre (latin oxygenium)."},
  {k:"tecken",q:"Vilket grundämne har tecknet <span class='mono'>H</span>?",opts:["Helium","Väte","Kvicksilver","Järn"],c:1,why:"H = väte (hydrogenium). Helium är He."},
  {k:"tecken",q:"Vilket grundämne har tecknet <span class='mono'>C</span>?",opts:["Koppar","Klor","Kol","Kalcium"],c:2,why:"C = kol (carboneum). Koppar är Cu, klor Cl, kalcium Ca."},
  {k:"tecken",q:"Vilket grundämne har tecknet <span class='mono'>N</span>?",opts:["Natrium","Nickel","Neon","Kväve"],c:3,why:"N = kväve (nitrogenium). Natrium är Na, nickel Ni."},
  {k:"tecken",q:"Vilket kemiskt tecken har järn?",opts:["J","Fe","Ir","Ja"],c:1,why:"Järn = Fe (ferrum)."},
  {k:"tecken",q:"Vilket kemiskt tecken har koppar?",opts:["Co","Ko","Cu","CU"],c:2,why:"Koppar = Cu (cuprum). Co är kobolt, och CU vore en kolatom och en uranatom."},
  {k:"tecken",q:"Vilket kemiskt tecken har guld?",opts:["Au","Ag","Gu","G"],c:0,why:"Guld = Au (aurum). Ag är silver."},
  {k:"tecken",q:"Vilket grundämne har tecknet <span class='mono'>Na</span>?",opts:["Kväve","Neon","Natrium","Nickel"],c:2,why:"Na = natrium. Salt består av natrium och klor."},
  {k:"tecken",q:"Vad är <span class='mono'>H<sub>2</sub>O</span>?",opts:["Väteperoxid","Vatten","Vätgas","Syrgas"],c:1,why:"Två väteatomer och en syreatom = en vattenmolekyl."},
  {k:"tecken",q:"Vad är <span class='mono'>CO<sub>2</sub></span>?",opts:["Kolmonoxid","Kobolt","Koldioxid","Syrgas"],c:2,why:"En kolatom och två syreatomer = koldioxid. CO (en syreatom) är kolmonoxid."},
  {k:"tecken",q:"Vad är <span class='mono'>O<sub>2</sub></span>?",opts:["Två syremolekyler","En syremolekyl (syrgas)","Ozon","Vatten"],c:1,why:"O<sub>2</sub> är en molekyl av två syreatomer, syrgas. Två syremolekyler skrivs 2O<sub>2</sub>."},
  {k:"tecken",q:"Hur skriver man kolmonoxid?",opts:["CO<sub>2</sub>","Co","CO","C<sub>2</sub>O"],c:2,why:"CO: en kolatom och en syreatom. Co (litet o) är grundämnet kobolt."}
 ]},

{id:"forandras",nr:4,sym:"Re",kap:1,title:"Ämnen kan förändras",pages:"s. 33–34",
 intro:"Kemiska reaktioner, reaktionsformler och fysikaliska förändringar.",
 el:{s:"C",n:"Kol",z:6,f:"När kol reagerar med syre bildas koldioxid: C + O₂ → CO₂."},letter:"O",
 cards:[
  {t:"Kemisk reaktion",d:"När ämnen förändras och det bildas nya ämnen med andra egenskaper. Exempel: ved som brinner, en brustablett i vatten, citron i te."},
  {t:"Reagera",d:"När ämnen förenas och bildar nya ämnen. Kolatomerna i veden reagerar med syremolekylerna i luften."},
  {t:"Förbränning",d:"En kemisk reaktion mellan ett ämne och syre, t.ex. när trä brinner. Det bildas aska, rök, koldioxid, vattenånga och andra gaser."},
  {t:"Cellulosa",d:"Det som ved till största delen består av. Ett ämne med långa kedjor av kol-, väte- och syreatomer."},
  {t:"Reaktionsformel",d:"Beskriver en kemisk reaktion: vilka ämnen som deltar, vad som sker och vad som bildas. Till vänster om pilen står ämnena som reagerar, till höger det som bildas: <span class='mono'>C + O<sub>2</sub> → CO<sub>2</sub></span>."},
  {t:"Fysikalisk förändring",d:"När ett ämne går över till en annan fas utan att det bildas något nytt ämne. Is som smälter är fortfarande vatten."},
  {t:"Fas",d:"Ett ämnes form: fast, flytande eller gas."},
  {t:"Ingenting försvinner",d:"Vid kemiska reaktioner försvinner inga atomer. De kombineras om till nya ämnen. Allt finns kvar."}
 ],
 qs:[
  {k:"kan",q:"Vad är en kemisk reaktion?",a:"<p>När ämnen förändras och det bildas nya ämnen med andra egenskaper, t.ex. förbränning av trä.</p>"},
  {k:"kan",q:"Vad är skillnaden mellan en fysikalisk förändring och en kemisk reaktion?",a:"<p>Vid en <b>fysikalisk förändring</b> byter ämnet bara fas (t.ex. is smälter till vatten) och är fortfarande samma ämne. Vid en <b>kemisk reaktion</b> bildas nya ämnen med nya egenskaper.</p>"},
  {k:"kan",q:"Vad är en reaktionsformel?",a:"<p>Ett sätt att beskriva en kemisk reaktion med kemiska tecken och formler, t.ex. C + O<sub>2</sub> → CO<sub>2</sub>. Till vänster står det som reagerar, till höger det som bildas.</p>"},
  {k:"kan",q:"Vad menas med att ”Ingenting försvinner, allt finns kvar”?",a:"<p>Vid kemiska reaktioner försvinner inga atomer. De kombineras om och bildar nya ämnen.</p>"},
  {k:"kan",q:"Ge exempel på kemiska reaktioner i vardagen och i kroppen.",a:"<ul><li>Ved som brinner.</li><li>En brustablett i vatten (koldioxid bubblar).</li><li>Citron i te gör teet ljusare.</li><li>Matsmältning: maten omvandlas till koldioxid, vatten och energi.</li><li>Fotosyntesen i växter.</li></ul>"},
  {k:"fund",q:"Vad innebär det att ett ämne reagerar med ett annat ämne?",a:"<p>Atomerna i ämnena binds ihop på nya sätt, så att det bildas nya ämnen med andra egenskaper.</p>"},
  {k:"kan",q:"Vad bildas när veden brinner i en brasa?",a:"<p>Aska och rök som består av koldioxid, vattenånga och en del andra gaser.</p>"},
  {k:"kan",q:"Vilken gas bubblar upp när man lägger en brustablett i vatten?",a:"<p>Koldioxid. Det sker en kemisk reaktion mellan vattnet och ämnena i tabletten.</p>"},
  {k:"tf",q:"När tenn smälter bildas ett nytt ämne.",tf:false,why:"Det är en fysikalisk förändring. Tennet byter bara fas."},
  {k:"tf",q:"När man eldar ett vedträ så försvinner alla ämnen utom kolet som blir aska.",tf:false,why:"Inga ämnen försvinner. Det bildas koldioxid, vattenånga och andra gaser som sprids i luften."},
  {k:"tf",q:"En kemisk reaktion ger alltid ett nytt ämne med nya egenskaper.",tf:true,why:"Det är just det som är en kemisk reaktion."},
  {k:"tf",q:"Den kemiska formeln CO<sub>2</sub> visar att två syreatomer är bundna till en kolatom.",tf:true,why:"C = en kolatom, O<sub>2</sub> = två syreatomer."}
 ]},

{id:"egenskaper",nr:5,sym:"Eg",kap:1,title:"Ämnens egenskaper",pages:"s. 35–39",
 intro:"Faser och partikelmodellen, smältpunkt och kokpunkt, densitet och magnetism.",
 el:{s:"Fe",n:"Järn",z:26,f:"Järn är magnetiskt och har högre densitet än aluminium: en liter järn väger 7,9 kg."},letter:"L",
 cards:[
  {t:"Egenskaper",d:"Det som kan avslöja vilket ämne det är: fast/flytande/gas, färg, smak och doft, smältpunkt och kokpunkt, densitet, hårdhet, leder ström, leder värme, magnetisk, frätande. I labbsalen får du ALDRIG smaka."},
  {t:"Koldioxid och kolmonoxid",d:"Båda består av kol och syre men har olika egenskaper. Koldioxid (CO<sub>2</sub>) har två syreatomer per kolatom och finns i luften vi andas. Kolmonoxid (CO) har en syreatom och är en giftig gas."},
  {t:"Glukos och fruktos",d:"Har samma formel, C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>, men olika egenskaper eftersom atomerna binder på olika sätt. Glukos (druvsocker) tas upp i hela kroppen, fruktos bara av levern."},
  {t:"Fasförändring",d:"När ett ämne går från en fas till en annan, t.ex. smälter, kokar eller kondenserar."},
  {t:"Aggregationstillstånd",d:"Gemensamt namn för faserna fast, flytande och gas. Kallas också aggregationsformer."},
  {t:"Fast form",d:"Partiklarna ligger tätt intill varandra och är ganska orörliga."},
  {t:"Flytande form",d:"Partiklarna är rörliga och kan glida runt varandra."},
  {t:"Gasform",d:"Partiklarna är så långt ifrån varandra att de inte längre har kontakt och rör sig fritt."},
  {t:"Temperatur",d:"När man mäter temperatur mäter man egentligen hur mycket partiklarna rör sig. Värme ger rörelse."},
  {t:"Absoluta nollpunkten",d:"−273,15 °C. Då är partiklarna i princip helt stilla. Det är den lägsta temperatur som finns, det kan inte bli kallare."},
  {t:"Smältpunkt",d:"Temperaturen när ett fast ämne smälter. Vattnets smältpunkt är 0 °C."},
  {t:"Fryspunkt",d:"Temperaturen när ett flytande ämne fryser eller stelnar. Samma temperatur som smältpunkten: för vatten 0 °C."},
  {t:"Kokpunkt",d:"Temperaturen när ett ämne kokar och övergår till gas. Vattnets kokpunkt är 100 °C. Vatten kan inte bli varmare än så i flytande form."},
  {t:"Kondensationspunkt",d:"Temperaturen när en gas kondenserar till vätska. Samma som kokpunkten: för vatten 100 °C."},
  {t:"Densitet",d:"Vikt (massa) per volym. En liter vatten väger 1 kg, aluminium 2,7 kg, järn 7,9 kg, bly 11,3 kg och guld 19,3 kg. Beror på hur tunga atomerna är och hur tätt de ligger."},
  {t:"Isens densitet",d:"Vatten är ovanligt: is har lägre densitet än flytande vatten. Därför flyter isen och lägger sig på sjöns yta, så att fiskarna kan överleva vintern."},
  {t:"Magnetism",d:"Bara tre metaller är magnetiska: järn, nickel och kobolt."},  {t:"Förångas",d:"När ett ämne går från flytande form till gasform. Sker vid kokpunkten (kokar) eller långsamt vid ytan (avdunstar)."},
  {t:"Stelnar",d:"När ett ämne går från flytande till fast form. Kallas fryser när det gäller vatten. Sker vid fryspunkten."},
  {t:"Fasschemat",d:FASCHEMA}
 ],
 qs:[
  {k:"kan",q:"Ge exempel på några egenskaper som man kan undersöka.",a:"<p>Fas (fast, flytande, gas), färg, doft, smältpunkt och kokpunkt, densitet, hårdhet, om det leder ström eller värme, om det är magnetiskt, om det löser sig i vatten och om det är frätande.</p>"},
  {k:"kan",q:"Vilka tre faser kan nästan alla ämnen finnas i?",a:"<p>Fast form, flytande form och gasform.</p>"},
  {k:"fund",q:"Ge exempel på egenskaper som är lika för vatten och matolja, och egenskaper som är olika.",a:"<p><b>Lika:</b> båda är flytande vid rumstemperatur och man kan se igenom dem.</p><p><b>Olika:</b> olja har lägre densitet och flyter på vatten, de blandas inte med varandra, olja kan brinna men vatten släcker eld, olja är gulaktig och har en annan kokpunkt.</p>"},
  {k:"kan",q:"Varför flyter kork i vatten?",a:"<p>Kork har lägre densitet än vatten.</p>"},
  {k:"kan",q:"Vad beror det på att ett ämne har högre densitet än ett annat?",a:"<p>Två saker: hur mycket atomerna väger (fler protoner i kärnan ger tyngre atom) och hur tätt atomerna ligger. Järn har tyngre atomer som ligger tätare än aluminium.</p>"},
  {k:"kan",q:"Varför fryser inte en sjö nedifrån botten och upp?",a:"<p>Is har lägre densitet än flytande vatten, så isen flyter och lägger sig på ytan. Under isen kan fiskar och andra organismer överleva vintern.</p>"},
  {k:"bort",q:"Vilken ska bort: aluminium, järn, nickel, kobolt?",opts:["Aluminium","Järn","Nickel","Kobolt"],c:0,why:"Järn, nickel och kobolt är magnetiska. Aluminium är inte det."},
  {k:"bort",q:"Vilken ska bort: fast form, magnetisk, flytande form, gasform?",opts:["Fast form","Magnetisk","Flytande form","Gasform"],c:1,why:"De andra tre är faser (aggregationstillstånd). Magnetisk är en annan sorts egenskap."},
  {k:"fund",q:"Varför har flytande vatten andra egenskaper än is, trots att det är uppbyggt av likadana vattenmolekyler?",a:"<p>Det beror på hur mycket molekylerna rör sig och hur nära de är varandra. I is ligger de nästan still och tätt ihop. I flytande vatten rör de sig och kan glida runt varandra.</p>"},
  {k:"fund",q:"Om man tar fram en mjölkförpackning ur kylen och låter den stå framme blir den fuktig på utsidan. Förklara vad som har hänt.",a:"<p>Luften innehåller vattenånga. När den varma luften möter den kalla förpackningen kyls vattenångan ned och kondenserar till små vattendroppar på utsidan.</p>"},
  {ej:1,k:"klur",q:"Om man blandar 1 dl vatten och 1 dl rödsprit blir volymen mindre än 2 dl. Gör en hypotes som kan förklara detta.",a:"<p>Ett förslag: molekylerna har olika storlek, så de mindre molekylerna kan tränga in i mellanrummen mellan de större. Tänk på att hälla sand i en skål med ärtor: sanden tar nästan ingen extra plats.</p>"},
  {k:"fund",q:"Smältpunkt och kokpunkt (°C): vatten 0/100, kvicksilver −38/357, klor −101/−34, kväve −210/−196, syre −218/−183. Vilka ämnen är gaser vid −100 °C?",a:"<p><b>Kväve och syre.</b> −100 °C är varmare än deras kokpunkter. Klor är flytande vid −100 °C eftersom det är mellan smältpunkten −101 °C och kokpunkten −34 °C.</p>"},
  {k:"fund",q:"Samma tabell: vilka ämnen är fasta vid −200 °C?",a:"<p><b>Vatten, kvicksilver och klor.</b> Kväve (smältpunkt −210 °C) och syre (−218 °C) är fortfarande flytande vid −200 °C.</p>"},
  {k:"fund",q:"Samma tabell: vilken fas har kvicksilver vid 0 °C, och vid vilken temperatur kondenserar klor?",a:"<p>Kvicksilver är <b>flytande</b> vid 0 °C (mellan −38 och 357). Klor kondenserar vid <b>−34 °C</b> (kondensationspunkt = kokpunkt).</p>"},
  {k:"kan",q:"Socker och salt ser nästan likadana ut. Varför smakar de olika?",a:"<p>De består av olika atomer. Socker består av kol-, syre- och väteatomer, salt av natrium- och kloratomer.</p>"},
  {k:"kan",q:"Vad händer med partiklarna när man värmer ett ämne?",a:"<p>De rör sig mer och snabbare. Fast ämne smälter när partiklarna kan glida runt varandra. Värmer man mer kokar ämnet och partiklarna far iväg åt alla håll som gas.</p>"},
  {k:"tf",q:"Vattnets smältpunkt och fryspunkt är samma temperatur.",tf:true,why:"Båda är 0 °C. Namnet beror på från vilket håll man kommer."},
  {k:"tf",q:"Alla metaller är magnetiska.",tf:false,why:"Bara järn, nickel och kobolt."},
  {k:"tf",q:"En liter guld väger mer än en liter bly.",tf:true,why:"Guld 19,3 kg, bly 11,3 kg per liter."},  {k:"fas",fig:FASFIG("FAST","FLYTANDE"),q:"Vad heter fasövergången från fast till flytande form?",opts:["Smälter","Fryser/stelnar","Förångas/kokar","Kondenserar"],c:0,why:"Ämnet smälter vid sin smältpunkt. Is smälter vid 0 °C."},
  {k:"fas",fig:FASFIG("FLYTANDE","GAS"),q:"Vad heter fasövergången från flytande form till gas?",opts:["Kondenserar","Smälter","Förångas/kokar","Stelnar"],c:2,why:"Ämnet förångas. Vid kokpunkten kokar det. Vatten kokar vid 100 °C."},
  {k:"fas",fig:FASFIG("GAS","FLYTANDE"),q:"Vad heter fasövergången från gas till flytande form?",opts:["Förångas","Kondenserar","Fryser","Smälter"],c:1,why:"Gasen kondenserar vid kondensationspunkten, som är samma temperatur som kokpunkten."},
  {k:"fas",fig:FASFIG("FLYTANDE","FAST"),q:"Vad heter fasövergången från flytande till fast form?",opts:["Kondenserar","Smälter","Förångas","Fryser/stelnar"],c:3,why:"Ämnet fryser eller stelnar vid fryspunkten, som är samma temperatur som smältpunkten."},
  {k:"fund",q:"Beskriv vad som händer med vattenmolekylerna i en isbit när du värmer den från −10 °C till 100 °C.",a:"<ol><li><b>−10 °C till 0 °C:</b> isen är fast. Molekylerna ligger tätt och nästan stilla, men börjar röra sig mer när det blir varmare.</li><li><b>0 °C (smältpunkten):</b> molekylerna rör sig så mycket att de kan glida runt varandra. Isen smälter till flytande vatten.</li><li><b>0 °C till 100 °C:</b> molekylerna rör sig snabbare och snabbare.</li><li><b>100 °C (kokpunkten):</b> molekylerna rör sig så snabbt att de inte håller ihop alls utan far iväg åt alla håll. Vattnet kokar och blir vattenånga.</li></ol><p>Molekylerna är hela tiden samma vattenmolekyler, det är bara rörelsen och avståndet som ändras.</p>"},
  {k:"kan",q:"Vad händer med ett ämne vid dess kokpunkt?",a:"<p>Det kokar och övergår från flytande form till gas. Partiklarna rör sig så snabbt att de inte längre håller ihop. Vid samma temperatur kondenserar gasen tillbaka till vätska om den kyls.</p>"},
  {k:"kan",q:"Vad händer med ett ämne vid dess smältpunkt?",a:"<p>Det smälter och övergår från fast till flytande form. Partiklarna börjar glida runt varandra.</p>"},
  {k:"kan",q:"Vad händer med ett ämne vid dess fryspunkt?",a:"<p>Det fryser (stelnar) och övergår från flytande till fast form. Partiklarna rör sig så lite att de ligger tätt och nästan stilla. Fryspunkten är samma temperatur som smältpunkten.</p>"},
  {k:"fund",q:"Varför är fasövergångar inte kemiska reaktioner?",a:"<p>Vid en fasövergång bildas inga nya ämnen. Atomerna och molekylerna är desamma, det är bara hur mycket de rör sig och hur nära varandra de är som ändras. Is, vatten och vattenånga är alla H<sub>2</sub>O. Det är en fysikalisk förändring.</p>"},
  {k:"rutor",fig:PF("a"),q:"Ruta a: vad visar bilden?",opts:["Grundämne i gasform","Kemisk förening i gasform","Grundämne i fast form","Blandning i gasform"],c:0,why:"Bara ett slags atomer (grundämne). Partiklarna är långt ifrån varandra (gas)."},
  {k:"rutor",fig:PF("b"),q:"Ruta b: vad visar bilden?",opts:["Blandning i flytande form","Kemisk förening i fast form","Grundämne i fast form","Kemisk förening i gasform"],c:1,why:"Molekyler av två olika slags atomer (kemisk förening). De ligger tätt i ordnade rader (fast)."},
  {k:"rutor",fig:PF("c"),q:"Ruta c: vad visar bilden?",opts:["Grundämne i gasform","Kemisk förening i gasform","Blandning i gasform","Blandning i fast form"],c:2,why:"Två olika ämnen som inte är bundna till varandra (blandning). Långt isär (gas)."},
  {k:"rutor",fig:PF("d"),q:"Ruta d: vad visar bilden?",opts:["Grundämne i flytande form","Kemisk förening i fast form","Blandning i flytande form","Grundämne i gasform"],c:0,why:"Molekyler av två likadana atomer (grundämne, som O<sub>2</sub>). Nära varandra men oordnat (flytande)."},
  {k:"rutor",fig:PF("e"),q:"Ruta e: vad visar bilden?",opts:["Kemisk förening i flytande form","Blandning i flytande form","Blandning i gasform","Grundämne i fast form"],c:1,why:"Vattenmolekyler och ett annat ämne blandade (blandning, t.ex. en lösning). Nära varandra men oordnat (flytande)."}
 ]},

{id:"blandningar",nr:6,sym:"Bl",kap:1,title:"Rena ämnen och blandningar",pages:"s. 40–45",
 intro:"Lösningar, legeringar, emulsioner och uppslamningar. Varför läsk blir avslagen i solen.",
 el:{s:"Cu",n:"Koppar",z:29,f:"Tiokronan och femkronan består av 89 % koppar, 5 % aluminium, 5 % zink och 1 % tenn. Det är en legering."},letter:"E",
 cards:[
  {t:"Rent ämne",d:"Ett ämne som inte är blandat med något annat. Grundämnen är alltid rena ämnen, men även kemiska föreningar kan vara det, t.ex. socker, koksalt och destillerat vatten."},
  {t:"Blandning",d:"Minst två olika rena ämnen som är blandade men inte kemiskt bundna till varandra. Ämnena i en blandning går alltid att skilja åt. Exempel: luft, saft, schampo, mjölk, blod."},
  {t:"Luft",d:"En blandning av bl.a. kväve, syre och koldioxid. Dessutom finns damm, sot och vattenånga i luften. Kan kallas en gasformig lösning."},
  {t:"Kranvatten",d:"En blandning. Det finns små mängder salter och klorföreningar i vattnet."},
  {t:"Lösning",d:"En blandning där delarna inte syns, eftersom ämnena är uppdelade i så små bitar. Exempel: saft."},
  {t:"Lösningsmedel",d:"Vätskan som löser ett annat ämne. Vatten är det vanligaste. Olja, lack och fett löser sig inte i vatten, då behövs andra lösningsmedel, t.ex. etylacetat, T-röd, T-grön eller lacknafta."},
  {t:"Legering",d:"En fast lösning av metaller. Exempel: brons (tenn + koppar), mässing (koppar + zink), rostfritt stål (krom, nickel, järn), lödtenn (bly + tenn), nysilver (koppar, zink, nickel)."},
  {t:"Karat",d:"Mäter guldhalten. 24 karat är rent guld. 18 karat betyder 18/24, alltså 75 % guld."},
  {t:"Mättad lösning",d:"En lösning som inte kan lösa mer av ett ämne. Det som inte löses lägger sig på botten."},
  {ej:1,t:"Övermättad lösning",d:"Om man värmer en mättad lösning kan man lösa lite mer. Så fort den kallnar faller ämnet ut igen. Används i handvärmare."},
  {t:"Lösa snabbare",d:"Finfördelning (krossa) och omrörning får ämnet att lösa sig snabbare. Fasta ämnen löser sig bättre i varma vätskor."},
  {t:"Rengöringsmedel",d:"Innehåller ämnen med en fettvänlig och en vattenvänlig del. Den fettvänliga delen lägger sig runt smutsen och den vattenvänliga är utåt, så smutsen kan sköljas bort."},
  {t:"Kolsyra",d:"Koldioxid löst i vatten. Ger läsk en syrlig och frisk smak."},
  {t:"Gasers löslighet",d:"Gaser löser sig bättre i kallt vatten. Därför bubblar läsk mer när den blir varm och serveras med is."},
  {t:"Emulsion",d:"En blandning av finfördelade vätskor som egentligen inte löser sig i varandra, t.ex. fett och vatten i hudkräm eller smör."},
  {t:"Emulgeringsmedel",d:"Ett ämne som lägger sig runt varje fettdroppe och håller dem svävande i vattnet, så att emulsionen inte delar sig."},
  {t:"Uppslamning",d:"En kortvarig blandning av ett fast ämne som inte löser sig i en vätska, t.ex. sand och lera i en vattenpöl. Efter en stund sjunker partiklarna till botten."}
 ],
 qs:[
  {k:"kan",q:"Vad är det för skillnad på ett rent ämne och en blandning?",a:"<p>Ett rent ämne är inte blandat med något annat, t.ex. ett grundämne eller socker. En blandning består av minst två rena ämnen som inte är kemiskt bundna till varandra och därför kan skiljas åt.</p>"},
  {k:"kan",q:"Vad menas med en mättad lösning?",a:"<p>En lösning som inte kan lösa mer av ett ämne. Det överblivna lägger sig på botten.</p>"},
  {k:"kan",q:"Hur kan du få en sockerbit att lösa sig snabbt i vatten?",a:"<p>Krossa den (finfördela), rör om och använd varmt vatten.</p>"},
  {k:"kan",q:"Ge exempel på några legeringar och vad de består av.",a:"<ul><li>Rostfritt stål: krom, nickel och järn</li><li>Mässing: koppar och zink</li><li>Brons: tenn och koppar</li><li>Nysilver: koppar, zink och nickel</li><li>Lödtenn: bly och tenn</li></ul>"},
  {k:"kan",q:"Vad är en emulsion?",a:"<p>En blandning av två vätskor som egentligen inte löser sig i varandra, t.ex. fett och vatten, där den ena är finfördelad i små droppar i den andra. Exempel: hudkräm och smör.</p>"},
  {k:"kan",q:"Vad händer om ett glas läsk står i solen?",a:"<p>Gaser löser sig sämre i varmt vatten. När läsken blir varm kan den inte hålla kvar lika mycket koldioxid, så gasen bubblar ut och läsken blir avslagen.</p>"},
  {k:"fund",q:"Förklara varför en öppnad läsk behåller kolsyran bättre om den står i kylen än i rumstemperatur.",a:"<p>Gasers löslighet är större i kallt vatten. I kylan kan mer koldioxid stanna löst i vätskan.</p>"},
  {k:"kan",q:"Varför sjunker sanden snabbare än leran i en uppslamning?",a:"<p>Lerpartiklarna är mindre och lättare, så de sjunker långsammare än sandkornen.</p>"},
  {k:"kan",q:"Hur kan diskmedel få bort fett?",a:"<p>Diskmedel innehåller ämnen med en fettvänlig och en vattenvänlig del. De finfördelar fettet: den fettvänliga delen fäster vid fettet och den vattenvänliga delen är utåt, så fettet kan sköljas bort med varmt vatten.</p>"},
  {k:"kan",q:"Hur kan fiskar andas under vatten?",a:"<p>Syre är löst i vattnet. Fiskarna tar upp det lösta syret med sina gälar.</p>"},
  {k:"kan",q:"Hur mycket guld innehåller ett 18 karats smycke?",a:"<p>18/24 = 75 % rent guld.</p>"},
  {ej:1,k:"fund",q:"Handvärmare: vad tror du händer när man knäpper på metallplattan?",a:"<p>Vätskan är en övermättad lösning. När man knäpper bildas små ”groddar” som kristaller kan växa på. Ämnet faller ut som kristaller och avger då energi i form av värme, precis som när socker bildar kristaller.</p>"},
  {ej:1,k:"fund",q:"Hur gör man för att återanvända handvärmaren och vad händer inuti den?",a:"<p>Man värmer den, t.ex. i kokande vatten. Då löses kristallerna upp igen och tar upp energi. När den svalnar har man åter en övermättad lösning som är redo att användas.</p>"},
  {k:"tf",q:"Dricksvatten är inte ett rent ämne.",tf:true,why:"Kranvatten innehåller små mängder salter och klorföreningar, så det är en blandning."},
  {k:"tf",q:"Luft är en blandning.",tf:true,why:"Kväve, syre, koldioxid med mera."},
  {k:"tf",q:"En lösning kan inte vara färgad.",tf:false,why:"Saft är en färgad lösning."},
  {k:"tf",q:"En legering är en kemisk förening mellan två eller flera metaller.",tf:false,why:"En legering är en blandning (fast lösning). Metallerna är inte kemiskt bundna till varandra."},  {k:"kan",q:"Vad är en lösning? Ge exempel.",a:"<p>En blandning där delarna inte syns, eftersom ämnena är uppdelade i så små bitar. Exempel: saft, läsk, saltvatten, te, havsvatten.</p>"},
  {k:"kan",q:"Vad är ett lösningsmedel? Ge exempel.",a:"<p>Vätskan som löser ett annat ämne. Vatten är det vanligaste. Andra exempel: etylacetat i nagellacksborttagning, T-röd, T-grön och lacknafta som löser fett, olja och lack.</p>"},
  {k:"kan",q:"Ge exempel på fasta, flytande och gasformiga lösningar.",a:"<ul><li><b>Fast:</b> legeringar som brons, mässing och rostfritt stål.</li><li><b>Flytande:</b> saft, läsk, saltvatten.</li><li><b>Gasformig:</b> luft.</li></ul>"},
  {k:"fund",q:"Hur påverkar temperaturen lösligheten för fasta ämnen och för gaser?",a:"<p><b>Fasta ämnen</b> (t.ex. socker) löser sig bättre i varmt vatten.</p><p><b>Gaser</b> löser sig sämre i varmt vatten. Därför bubblar läsk ur när den blir varm, och kallt vatten kan innehålla mer syre.</p>"},
  {k:"kan",q:"Vad är en uppslamning? Ge exempel.",a:"<p>En kortvarig blandning av ett fast ämne som inte löser sig i en vätska. Efter en stund sjunker partiklarna till botten. Exempel: sand och lera i en vattenpöl som man trampat i.</p>"},
  {k:"kan",q:"Ge exempel på andra typer av blandningar än lösningar.",a:"<p><b>Emulsion</b> (fett och vatten, t.ex. hudkräm, smör, salladsdressing som skakats) och <b>uppslamning</b> (lera i vatten).</p>"}
 ]},

{id:"separera",nr:7,sym:"Se",kap:1,title:"Att separera ämnen",pages:"s. 46–50",
 intro:"Separationsmetoder, och hur dricksvatten och avloppsvatten renas.",
 el:{s:"Cl",n:"Klor",z:17,f:"Klor eller ozon tillsätts i vattenverket för att döda bakterier. Det används också i simhallar."},letter:"K",
 cards:[
  {t:"Separationsmetod",d:"En metod för att skilja ämnen i en blandning åt, för att få fram rena ämnen. Hemma: filtrering, extrahering, indunstning. I industrin och laboratorier även destillering, sedimentering och kromatografi."},
  {t:"Extrahering",d:"Att lösa ut vissa ämnen ur en blandning. När varmt vatten passerar malet kaffe löser sig färg- och smakämnen i vattnet."},
  {t:"Filtrering",d:"Små partiklar passerar genom ett filter medan större fastnar. Kaffesumpen stannar kvar i filtret."},
  {t:"Indunstning",d:"Vätskan får avdunsta så att det lösta ämnet blir kvar. Används för att få fram havssalt: havsvatten avdunstar i stora bassänger."},
  {t:"Destillering",d:"Bygger på att ämnen har olika kokpunkter. Ämnet med lägst kokpunkt kokar först, blir gas, leds genom en kylare och blir flytande igen i en annan behållare. Höj temperaturen stegvis för att separera fler ämnen."},
  {t:"Destillerat vatten",d:"Rent vatten utan lösta ämnen. Tillverkas genom destillation."},
  {t:"Kromatografi",d:"Ämnen i en lösning sugs upp olika fort över ett papper eller annat poröst material. Används i industrin, för miljöanalyser och för att spåra dopningsmedel. Visar vilka ämnen som finns och hur mycket."},
  {t:"Sedimentering",d:"Tyngre partiklar i en vätska sjunker till botten. Används t.ex. i reningsverk."},
  {t:"Sediment",d:"Det som har sjunkit till botten vid sedimentering, t.ex. sand och grus."},
  {t:"Vattenverk",d:"Där vattnet kontrolleras och renas innan det kommer ut i kranen."},
  {t:"Grundvatten och ytvatten",d:"Dricksvatten kommer från grundvatten eller ytvatten (sjöar och älvar). Ytvatten är en blandning och måste alltid renas."},
  {t:"Ytvatten renas i fem steg",d:"<b>1.</b> Grovfiltrering (löv, plast silas bort) <b>2.</b> Kemisk rening (partiklar klumpar ihop sig och sedimenterar) <b>3.</b> Filtrering i sandfilter <b>4.</b> Desinfektion med klor eller ozon <b>5.</b> Tillsats av kalk (svagt basiskt så det inte fräter på ledningarna)."},
  {t:"Reningsverk",d:"Tar emot avloppsvatten från hushåll, industrier och gator och renar det innan det släpps ut i hav, sjöar och vattendrag."},
  {t:"Avloppsvatten renas i fyra steg",d:"<b>1.</b> Mekanisk rening (galler) <b>2.</b> Biologisk rening (bakterier bryter ned organiskt material) <b>3.</b> Kemisk rening (fosfater sedimenteras bort) <b>4.</b> Kväverening."},
  {t:"Rötslam",d:"De fasta resterna som blir kvar i reningsverket. Kan innehålla tungmetaller, mikroplaster och mediciner. Används för att tillverka biogas till bilar och bussar."},  {t:"Dricksvatten",d:"Vatten som vi kan dricka utan att bli sjuka. Kommer från grundvatten eller ytvatten och renas i ett vattenverk."},
  {t:"Avloppsvatten",d:"En blandning av vatten och andra ämnen från hushåll, industrier och gator: fasta partiklar, gödningsämnen och gifter. Renas i ett reningsverk."},
  {t:"Vattenverk eller reningsverk?",d:"<b>Vattenverk:</b> gör vatten från sjöar, älvar eller grundvatten till rent <i>dricksvatten</i> innan det går till kranen.<br><b>Reningsverk:</b> renar använt <i>avloppsvatten</i> innan det släpps ut i naturen."}
 ],
 qs:[
  {k:"kan",q:"Hur kan man skilja sand från vatten?",a:"<p>Med filtrering (sanden fastnar i filtret) eller sedimentering (låt sanden sjunka och häll av vattnet).</p>"},
  {k:"kan",q:"Hur fungerar ett filter?",a:"<p>Små partiklar, t.ex. vatten med lösta ämnen, passerar genom filtret medan större partiklar fastnar.</p>"},
  {k:"kan",q:"Hur kan man skilja salt från vatten?",a:"<p>Med indunstning: låt vattnet avdunsta så att saltet blir kvar. Med destillering får man dessutom tillbaka vattnet.</p>"},
  {k:"kan",q:"Hur tillverkar man destillerat vatten?",a:"<p>Genom destillation: vattnet kokas, vattenångan leds genom en kylare och blir flytande igen i en annan behållare. De lösta ämnena blir kvar.</p>"},
  {k:"kan",q:"Vilken separationsmetod bygger på att ämnen har olika kokpunkter?",a:"<p><b>Destillering.</b></p>"},
  {k:"kan",q:"Hur renas avloppsvatten?",a:"<p>I ett reningsverk i fyra steg: mekanisk rening, biologisk rening, kemisk rening och ibland kväverening.</p>"},
  {k:"kan",q:"Var kommer vårt dricksvatten ifrån?",a:"<p>Från grundvatten eller från ytvatten i en sjö eller älv.</p>"},
  {k:"kan",q:"Vad kan man göra för att undvika frätskador på vattenledningar?",a:"<p>Tillsätta kalk så att dricksvattnet blir svagt basiskt.</p>"},
  {k:"kan",q:"Vilka två separationsmetoder använder du när du brygger kaffe?",a:"<p>Extrahering (färg- och smakämnen löser sig i vattnet) och filtrering (kaffesumpen stannar i filtret).</p>"},
  {k:"ihop",q:"Vilken metod hör ihop med <b>miljöanalys</b>?",opts:["Filtrering","Destillering","Sedimentering","Kromatografi","Indunstning"],c:3,why:"Kromatografi används för olika miljöanalyser."},
  {k:"ihop",q:"Vilken metod hör ihop med att <b>brygga kaffe</b>?",opts:["Filtrering","Destillering","Sedimentering","Kromatografi","Indunstning"],c:0,why:"Kaffesumpen fastnar i filtret."},
  {k:"ihop",q:"Vilken metod hör ihop med ett <b>reningsverk</b>?",opts:["Filtrering","Destillering","Sedimentering","Kromatografi","Indunstning"],c:2,why:"I reningsverk får sand och skräp sjunka till botten i stora bassänger."},
  {k:"ihop",q:"Vilken metod hör ihop med <b>framställning av havssalt</b>?",opts:["Filtrering","Destillering","Sedimentering","Kromatografi","Indunstning"],c:4,why:"Havsvattnet avdunstar och saltet blir kvar."},
  {k:"ihop",q:"Vilken metod hör ihop med att <b>tillverka bensin</b>?",opts:["Filtrering","Destillering","Sedimentering","Kromatografi","Indunstning"],c:1,why:"Bensin separeras ur råolja med destillering, eftersom ämnena har olika kokpunkter."},
  {k:"fund",q:"Förklara skillnaden mellan indunstning och destillering.",a:"<p>Vid <b>indunstning</b> får vätskan avdunsta och försvinna, man får bara kvar det lösta ämnet. Vid <b>destillering</b> fångas gasen upp och kyls så att vätskan också samlas upp. Man kan även separera flera vätskor med olika kokpunkter.</p>"},
  {k:"fund",q:"Hur fungerar en destillationsapparat?",a:"<p>Lösningen värms i en kolv. Ämnet med lägst kokpunkt kokar först och blir gas. Gasen leds in i en kylare där kallt vatten strömmar runt röret, så att gasen kondenserar till vätska. Vätskan (destillatet) droppar ned i en annan behållare.</p>"},
  {ej:1,k:"klur",q:"Planera ett försök: en blandning består av vatten, salt, sand och små korkbitar. Hur får du tillbaka alla ämnen för sig?",a:"<ol><li>Plocka eller skumma bort korkbitarna som flyter (låg densitet).</li><li>Filtrera bort sanden (eller låt den sedimentera och häll av).</li><li>Destillera saltvattnet: vattnet samlas upp och saltet blir kvar. Med indunstning får du bara saltet.</li></ol><p><b>Risker:</b> heta kolvar och brännare, glas som kan gå sönder. Använd skyddsglasögon.</p>"},  {k:"kan",q:"Vad är indunstning? Ge exempel.",a:"<p>Vätskan får avdunsta så att det lösta ämnet blir kvar. Exempel: havssalt framställs genom att havsvatten får avdunsta i stora bassänger. Ett glas mjölk som står länge lämnar kvar en vit rest av fett och proteiner.</p>"},
  {k:"kan",q:"Vad är destillering? Ge exempel.",a:"<p>En metod som bygger på att ämnen har olika kokpunkter. Ämnet med lägst kokpunkt kokar först, och gasen kyls i en kylare så att den blir flytande igen i en annan behållare. Exempel: tillverkning av destillerat vatten, eller att få fram bensin ur olja.</p>"},
  {k:"kan",q:"Vad är sedimentering? Ge exempel.",a:"<p>Tyngre partiklar i en vätska får sjunka till botten och bilda ett sediment. Exempel: första steget i ett reningsverk där sand och grus sjunker i stora bassänger. Även i vattenverkets kemiska rening.</p>"},
  {k:"kan",q:"Vad är kromatografi? Ge exempel.",a:"<p>Ämnen i en lösning sugs upp olika fort över ett papper eller annat poröst material, så att de separeras. Exempel: miljöanalyser, spåra dopningsmedel i urin- och blodprov, eller separera färgerna i en tuschpenna.</p>"},
  {k:"kan",q:"Vad separerar man vid indunstning?",a:"<p>Ett löst fast ämne från vätskan, t.ex. salt från vatten. Vätskan försvinner som gas, det fasta ämnet blir kvar.</p>"},
  {k:"kan",q:"Vad separerar man vid filtrering?",a:"<p>Fasta partiklar som inte är lösta från en vätska, t.ex. sand eller kaffesump från vatten. Det lösta ämnet följer med vätskan genom filtret.</p>"},
  {k:"kan",q:"Hur kan man skilja två vätskor i en lösning från varandra?",a:"<p>Med <b>destillering</b>. Vätskorna har olika kokpunkter, så man värmer långsamt: vätskan med lägst kokpunkt kokar först, leds bort och kyls till vätska i en annan behållare.</p>"},
  {k:"kan",q:"Hur renas dricksvatten?",a:"<p>Ytvatten renas i ett vattenverk i fem steg:</p><ol><li>Grovfiltrering: löv och plast silas bort.</li><li>Kemisk rening: ämnen tillsätts så att små partiklar klumpar ihop sig och sedimenterar.</li><li>Filtrering i sandfilter.</li><li>Desinfektion med klor eller ozon som dödar bakterier.</li><li>Tillsats av kalk så att vattnet inte fräter på ledningarna.</li></ol>"},
  {k:"kan",q:"Vad är skillnaden mellan ett vattenverk och ett reningsverk?",a:"<p>Ett <b>vattenverk</b> renar vatten från sjöar, älvar eller grundvatten till dricksvatten innan det kommer till kranen. Ett <b>reningsverk</b> renar avloppsvatten som vi har använt innan det släpps ut i hav, sjöar och vattendrag.</p>"}
 ]},

{ej:true,id:"analysera",nr:8,sym:"An",kap:1,title:"Att analysera ämnen",pages:"s. 51–53",
 intro:"DNA-analys, reagens, dopingprov och miljöanalyser.",
 el:{s:"Ca",n:"Kalcium",z:20,f:"Kalkvatten innehåller kalcium. Det grumlas när man blåser ner koldioxid i det, så det är ett reagens på koldioxid."},letter:"",
 cards:[
  {t:"Analys",d:"Att undersöka ett prov för att ta reda på vilka ämnen som finns i det, och ibland hur mycket. Exempel: dopingtester och blod från brottsplatser."},
  {t:"DNA-analys",d:"Ger information om ursprung och släktingar, ärftliga sjukdomar och kan hjälpa till att hitta en gärningsman. Provet kan vara ett salivprov."},
  {t:"Elektrofores",d:"Metod som separerar molekyler med hjälp av elektricitet. Provet läggs i en gel i ett elektriskt fält. Långa molekyler vandrar långsamt och korta fort."},
  {t:"Reagens",d:"Ett ämne som reagerar på ett speciellt sätt med ett annat ämne, så att man kan känna igen det. Ett kännetecken."},
  {t:"Kalkvatten",d:"Reagens på koldioxid. Blåser man utandningsluft i kalkvatten blir det grumligt."},
  {t:"Glödande trästicka",d:"Reagens på syrgas. Stickan flammar upp och börjar brinna i ren syrgas."},
  {t:"Knallgas",d:"En blandning av vätgas och luft eller syrgas. En brinnande sticka får den att smälla, så knallgasprovet är ett reagens på väte. Väte och syre reagerar och bildar vatten."},
  {t:"Reagensstickor",d:"Doppas i t.ex. urin och färgen jämförs med en färgskala. Mycket socker kan tyda på diabetes, mycket protein på fel på njurarna. Graviditetstest fungerar också så."},
  {t:"Dopingprov",d:"Prov som avslöjar otillåtna medel hos idrottare. Analyseras i särskilda laboratorier."},
  {t:"GC-MS",d:"Gaskromatografi och masspektrometri. Provet delas upp efter molekylernas egenskaper och visas som toppar i ett diagram som jämförs med kända ämnen."},
  {t:"Miljöanalys",d:"Analyser av luft, vatten och mark för att se hur miljön mår, t.ex. luftföroreningar, pollen och koldioxidhalten i atmosfären."}
 ],
 qs:[
  {k:"kan",q:"Vad menas med en analys?",a:"<p>Att undersöka ett prov för att ta reda på vilka ämnen som finns i det (och hur mycket).</p>"},
  {k:"kan",q:"Ge exempel på några områden där man gör kemiska analyser.",a:"<p>Dopingtester inom idrotten, brottsutredningar, sjukvården (urinprov, blodprov), DNA-analys för släktforskning och miljöanalyser av luft, vatten och mark.</p>"},
  {k:"kan",q:"Vad kan man undersöka med gaskromatografi och masspektrometri (GC-MS)?",a:"<p>Vilka ämnen som finns i ett prov, t.ex. om ett dopingprov innehåller förbjudna medel.</p>"},
  {k:"kan",q:"Vad kan man få fram vid en DNA-analys?",a:"<p>Information om ens ursprung och släktingar, ärftliga sjukdomar, och vem som kan ha varit på en brottsplats.</p>"},
  {k:"kan",q:"Vad menas med ett reagens?",a:"<p>Ett ämne som reagerar på ett speciellt sätt med ett annat ämne, så att man kan känna igen det. Kalkvatten är t.ex. reagens på koldioxid.</p>"},
  {k:"kan",q:"Nämn tre reagens och vad de visar.",a:"<ul><li>Kalkvatten grumlas av koldioxid.</li><li>En glödande trästicka flammar upp i syrgas.</li><li>Knallgas (väte + luft) smäller av en brinnande sticka.</li></ul>"},
  {k:"kan",q:"Hur fungerar elektrofores?",a:"<p>Provet läggs i en gel i ett elektriskt fält. Molekylerna vandrar genom gelen: långa molekyler långsamt, korta fort. Så separeras de.</p>"},
  {k:"kan",q:"Varför analyserar man koldioxidhalten i atmosfären?",a:"<p>Förhöjda halter av koldioxid är ett stort miljöproblem som påverkar klimatet så att medeltemperaturen höjs. Analyserna gör att man kan följa förändringen över tid.</p>"},
  {k:"tf",q:"En analys av ett prov säger hur giftigt ämnet är.",tf:false,why:"En analys visar vilka ämnen som finns i provet (och hur mycket)."},
  {k:"tf",q:"Med reagensstickor kan man få reda på mer om sina förfäder.",tf:false,why:"Det gör man med DNA-analys. Reagensstickor används t.ex. för urinprov."},
  {k:"tf",q:"Man mäter koldioxidhalten i luften därför att koldioxid är giftigt för oss människor.",tf:false,why:"Man mäter den för att höga halter påverkar klimatet."},
  {k:"tf",q:"Kalkvatten är ett reagens på koldioxid.",tf:true,why:"Kalkvatten grumlas av koldioxid."}
 ]},

{id:"vatten",nr:9,sym:"Vk",kap:2,title:"Vattnets kretslopp",pages:"s. 67–69",
 intro:"Kapitel 2. Fasförändringar i vattnets kretslopp, hur kretsloppet renar vattnet och hur temperaturen påverkar vattenånga och lösta gaser. Kretslopp och energi (s. 64–66) är bakgrund.",
 el:{s:"Na",n:"Natrium",z:11,f:"Salt består av natrium och klor. När havsvatten avdunstar stannar saltet kvar i havet. Bara rent vatten stiger upp."},letter:"Y",
 cards:[
  {t:"Kretslopp",d:"<i>Bakgrund s. 64.</i> En process som sker varv efter varv utan slut. Atomerna försvinner aldrig, de kombineras om till nya ämnen."},
  {t:"Kretslopp behöver energi",d:"<i>Bakgrund s. 65.</i> Solens värme driver t.ex. vattnets kretslopp genom att få vatten att avdunsta."},
  {t:"Vattnets kretslopp",d:"Solen värmer vattenytan → vattnet avdunstar → vattenånga stiger och kondenserar till moln → nederbörd (regn, snö) → vattnet rinner till sjöar och hav eller ner i marken som grundvatten."},
  {t:"Avdunsta",d:"När vatten övergår från flytande form till gas (vattenånga). Sker när solen värmer sjöar, hav, mark och växter."},
  {t:"Kondensera",d:"När vattenånga kyls och blir vattendroppar. Högre upp i atmosfären är det kallare, där bildas moln."},
  {t:"Nederbörd",d:"Vatten som faller till marken som regn eller frusna iskristaller (snö)."},
  {t:"Fasförändringar i kretsloppet",d:"Vattnet omvandlas mellan fast form, flytande form och gasform: avdunstning, kondensation, frysning och smältning."},
  {t:"Rent vatten i gasform",d:"När havsvatten avdunstar är det bara vattenmolekylerna som blir gas. Salt och andra partiklar blir kvar i havet."},
  {t:"Havsis är nästan saltfri",d:"När havsvatten fryser bildar vattenmolekylerna ett regelbundet mönster, iskristaller. Saltet passar inte in i mönstret."},
  {t:"Grundvatten",d:"Vatten som filtreras genom marken och samlas under jorden. Det renaste vattnet, därför tar vi helst dricksvatten från brunnar som når grundvattnet."},
  {t:"Tre naturliga separationsmetoder",d:"Vattnets kretslopp renar vattnet genom <b>avdunstning, kristallisation och filtrering</b>."},
  {ej:1,t:"Temperatur och vattenånga",d:"Det är temperaturen som styr avdunstning och kondensation. Varm luft kan innehålla mer vattenånga. Luft innehåller alltid en viss mängd vattenånga."},
  {ej:1,t:"Imma",d:"När varm luft möter kalla glasögon kondenserar vattenångan i luften till små droppar. Imman visar att det finns vatten i luften."},
  {ej:1,t:"Gasers löslighet i vatten",d:"Ju kallare vatten, desto mer gas kan lösas. Ett glas kallt vatten som står framme över natten får gasbubblor när det blir rumsvarmt."},
  {ej:1,t:"Syre och koldioxid i vatten",d:"I luft finns ca 500 gånger mer syrgas än koldioxid. I vatten är halten koldioxid mycket större, syre bara dubbelt så mycket. Koldioxid löser sig lätt och bildar kolsyra."},  {t:"Solens roll",d:"Solen ger energin som driver vattnets kretslopp. Solens värme får vatten att avdunsta från hav, sjöar, mark och växter. Utan solen skulle kretsloppet stanna."},
  {t:"Vatten som lösningsmedel och transportör",d:"Vatten löser många ämnen och för dem med sig. Regnvatten löser näringsämnen i marken som växterna tar upp med rötterna. Floder för lösta ämnen och partiklar ut till havet. I kroppen transporterar blodet, som till stor del är vatten, näring och syre till cellerna."},
  {t:"Allt liv är beroende av vatten",d:"Nästan två tredjedelar av människokroppen består av vatten. Alla levande organismer behöver vatten: som lösningsmedel och transportör i kroppen och i växter, och fiskar andas syre som är löst i vattnet. Därför är alla beroende av vattnets kretslopp."}
 ],
 qs:[
  {k:"kan",q:"Vad är ett kretslopp?",a:"<p>En process som sker varv efter varv utan slut. Ämnena omvandlas men atomerna försvinner aldrig.</p>"},
  {k:"kan",q:"Vad krävs för att ett kretslopp ska hållas igång?",a:"<p>Energi, t.ex. solens värme som får vatten att avdunsta.</p>"},
  {k:"kan",q:"Beskriv vattnets kretslopp.",a:"<p>Solen värmer hav, sjöar, mark och växter så att vatten avdunstar. Vattenångan stiger och kondenserar till vattendroppar som bildar moln. När dropparna blir stora faller de som regn eller snö. Vattnet rinner till sjöar och hav eller ner genom marken till grundvattnet, och så börjar det om.</p>"},
  {k:"kan",q:"Vilka fasförändringar sker i vattnets kretslopp?",a:"<p>Avdunstning (flytande → gas), kondensation (gas → flytande), frysning till snö och is (flytande → fast) och smältning (fast → flytande).</p>"},
  {k:"kan",q:"Varför är vattenångan som avdunstar från havet rent vatten?",a:"<p>Det är bara vattenmolekylerna som avdunstar. Salt och andra lösta ämnen blir kvar i havet.</p>"},
  {k:"kan",q:"Varför blir havsis nästan helt fri från salt?",a:"<p>När vattnet fryser bildar vattenmolekylerna ett regelbundet mönster. Saltet passar inte in i mönstret och blir inte en del av isen.</p>"},
  {k:"kan",q:"Vilka tre separationsmetoder renar vattnet i vattnets kretslopp?",a:"<p>Avdunstning, kristallisation och filtrering.</p>"},
  {k:"kan",q:"Varför tar vi helst dricksvatten från brunnar som når grundvattnet?",a:"<p>Grundvattnet har filtrerats genom marken och är det renaste vattnet.</p>"},
  {ej:1,k:"kan",q:"Vad styr hur mycket vattenånga som finns i luften?",a:"<p>Temperaturen. När temperaturen stiger avdunstar mer vatten. När den sjunker kondenserar vattenångan till droppar, moln och nederbörd.</p>"},
  {ej:1,k:"kan",q:"Varför får man imma på glasögonen när man kommer in från kylan?",a:"<p>Den varma luften inomhus innehåller vattenånga. När den möter de kalla glasögonen kyls ångan och kondenserar till små droppar.</p>"},
  {ej:1,k:"kan",q:"Varför bildas det gasbubblor i ett glas kallt vatten som står framme över natten?",a:"<p>När vattnet blir varmare minskar gasernas löslighet. Luften som var löst i det kalla vattnet ”får inte längre plats” och bildar bubblor.</p>"},
  {ej:1,k:"kan",q:"Varför är det viktigt att syre kan lösas i vatten?",a:"<p>Djur som lever i vatten, t.ex. fiskar, andas syret som är löst i vattnet.</p>"},
  {ej:1,k:"kan",q:"Vad är kolsyra?",a:"<p>Koldioxid som är löst i vatten.</p>"},
  {k:"klur",q:"Vem har rätt? Hur kan man märka att luften innehåller vattenånga?",opts:["A: Det blir dagg i gräset.","B: Luften känns kall.","C: Det blir imma på glasögonen.","D: Det ryker när man andas."],c:-1,multi:[0,2,3],why:"A, C och D visar alla att vattenånga kondenserar till droppar. Att luften känns kall (B) säger inget om vattenånga."},
  {k:"tf",q:"I ett kretslopp förändras inte de kemiska föreningarna.",tf:false,why:"Föreningarna kan förändras på vägen. Det är atomerna som inte förändras."},
  {k:"tf",q:"I ett kretslopp finns atomerna kvar eftersom de inte kan förstöras.",tf:true,why:"Atomer kan varken skapas eller förstöras."},
  {k:"tf",q:"Ett kretslopp skapar lika mycket energi som det förbrukar.",tf:false,why:"Ett kretslopp behöver tillförd energi, t.ex. från solen."},
  {k:"tf",q:"Olika kretslopp tar olika lång tid för att gå ett varv.",tf:true,why:"Mineralernas kretslopp tar hundratals miljoner år, kolets snabba kretslopp kan ta månader."},
  {ej:1,k:"tf",q:"Kallt vatten kan lösa mer syre än varmt vatten.",tf:true,why:"Gasers löslighet är störst i kallt vatten."},
  {k:"tf",q:"Vattenångan som stiger från havet är salt.",tf:false,why:"Bara vattenmolekylerna avdunstar. Saltet stannar i havet."},  {k:"kan",q:"Vilken roll har solen i vattnets kretslopp?",a:"<p>Solen ger energin. Solens värme får vatten att avdunsta från hav, sjöar, mark och växter, så att kretsloppet hålls igång.</p>"},
  {k:"fund",q:"Rita vattnets kretslopp och förklara med begreppen avdunstning, kondens, grundvatten och fasförändringar. Jämför sedan med facit.",a:"<p><b>Avdunstning:</b> solen värmer vattnet så att det blir vattenånga (flytande → gas).</p><p><b>Kondens:</b> högre upp är det kallare, ångan kondenserar till droppar och bildar moln (gas → flytande).</p><p><b>Nederbörd:</b> regn eller snö faller (snö = fast form).</p><p><b>Grundvatten:</b> vatten rinner ner genom marken och samlas under jorden. Annat vatten rinner via bäckar och floder till sjöar och hav.</p><p><b>Fasförändringar:</b> vattnet växlar mellan fast, flytande och gasform.</p>"+KRETSLOPP},
  {k:"fund",q:"Ge exempel på när vatten fungerar som både lösningsmedel och transportör.",a:"<ul><li>Regnvatten löser näringsämnen i marken, och växterna tar upp dem med vattnet genom rötterna.</li><li>Floder och bäckar för lösta ämnen och partiklar ut till havet.</li><li>Blodet, som till stor del är vatten, löser och transporterar näring och syre i kroppen.</li></ul>"},
  {k:"fund",q:"Vad betyder uttrycket ”Allt liv är beroende av vatten”?",a:"<p>Alla levande organismer behöver vatten för att leva. Nästan två tredjedelar av människokroppen är vatten. Vatten löser och transporterar ämnen i kroppen och i växter, och djur i vatten andas syre som är löst i vattnet. Därför är allt liv beroende av vattnets kretslopp, som hela tiden ger nytt, renat vatten.</p>"}
 ]},

 cards:[

  {ej:1,k:"klur",q:"Vem har rätt? När ämne A och B reagerar med varandra bildas ett giftigt ämne C. Kan det bli så?",opts:["A: C kan bli giftigt fastän A och B inte är giftiga.","B: Är A och B giftiga, blir C också giftigt.","C: Det räcker med att ett av ämnena A eller B är giftigt, då blir C också giftigt."],c:0,why:"En kemisk förening har andra egenskaper än ämnena den bildas av. Kol och syre är inte giftiga men kolmonoxid är det. Åt andra hållet kan giftiga ämnen bilda ofarliga föreningar."},
  {ej:1,k:"bort",q:"Vad ska bort: choklad, kopparplåt, kol eller syrgas (O<sub>2</sub>)? Motivera.",opts:["Choklad","Kopparplåt","Kol","Syrgas"],c:0,why:"Choklad är en blandning av många ämnen. Koppar, kol och syrgas är grundämnen. (Man kan också säga syrgas eftersom det är den enda gasen, men grundämne kontra blandning är den kemiska tanken.)"},
  {k:"fund",q:"Förr trodde man att alla utsläpp från en fabrik försvann bara man byggde tillräckligt höga skorstenar. Hur vet du att det inte är så?",a:"<p>Ingenting försvinner. Atomerna i utsläppen finns kvar. De sprids med vinden och kommer ner någon annanstans, i luft, vatten och mark, och kan skada miljö och hälsa där.</p>"},
  {ej:1,k:"fund",q:"Ta ställning: en del kemikalier som har framställts har varit skadliga. Det skulle bli bättre om man inte framställde nya kemikalier. Tycker du det är ett bra förslag?",a:"<p>Här finns inget enda rätt svar. Ett bra svar tar upp båda sidor:</p><ul><li><b>För:</b> vissa kemikalier har skadat människor och natur, t.ex. hälsofarliga tillsatser och kopparföreningar i havet.</li><li><b>Emot:</b> nya kemikalier behövs för läkemedel (t.ex. penicillin), miljövänliga material och nya drivmedel. Grön kemi och miljömärkning gör det säkrare.</li></ul>"},

/* ---------- Lagring (sparas i den här webbläsaren) ---------- */
var KEY="kemiplugget-v1";
function fresh(){return {cards:{},qs:{},unlocked:[],last:null,gold:false,reverse:false,name:"",hideDone:false,eggs:{}};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var f=fresh();for(var k in o)f[k]=o[k];return f;}}catch(e){}return fresh();}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Hjälpare ---------- */
function $(s,r){return (r||document).querySelector(s);}
function byId(id){for(var i=0;i<AREAS.length;i++)if(AREAS[i].id===id)return AREAS[i];return null;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function known(a){var o=S.cards[a.id]||{},n=0;for(var k in o)if(o[k]&&+k<a.cards.length)n++;return n;}
function qok(a){var o=S.qs[a.id]||{},n=0;for(var k in o)if(o[k]==="ok"&&+k<a.qs.length)n++;return n;}
function prog(a){var kc=known(a),qo=qok(a),kt=a.cards.length,qt=a.qs.length;return {kc:kc,kt:kt,qo:qo,qt:qt,pct:Math.round(100*(kc+qo)/(kt+qt)),done:kc>=kt&&qo>=qt};}
function totalPct(){var d=0,t=0;AREAS.forEach(function(a){var p=prog(a);d+=p.kc+p.qo;t+=p.kt+p.qt;});return Math.round(100*d/t);}
var KIND={kan:"Kan du?",tf:"Rätt eller fel?",fund:"Fundera och förklara",fyll:"Vilket ord saknas?",klur:"Vem har rätt?",ihop:"Vilka hör ihop?",bort:"Vad ska bort?",symbol:"Farosymbol",fas:"Fasövergångar",rutor:"Uppgift 13 · Vad visar rutan?",tecken:"Kemiska tecken och formler"};

  h+='<div class="collection">';

    h+=on?'<button class="slot on'+(a.letter?'':' bonus')+'" data-act="fact" data-id="'+a.id+'" aria-label="'+a.el.n+'"><b>'+a.el.s+'</b><span>'+(a.letter||'★')+'</span></button>':'<div class="slot" aria-label="Låst">?</div>';});
  h+='</div>';

function areaHead(a){var p=prog(a);
  return '<div class="progline" id="areaProg"><div class="pbox'+(p.kc>=p.kt?' full':'')+'"><div class="lbl">Begrepp jag kan</div><div class="num">'+p.kc+' / '+p.kt+'</div><div class="meter"><i style="width:'+(100*p.kc/p.kt)+'%"></i></div></div><div class="pbox'+(p.qo>=p.qt?' full':'')+'"><div class="lbl">Frågor klara</div><div class="num">'+p.qo+' / '+p.qt+'</div><div class="meter"><i style="width:'+(100*p.qo/p.qt)+'%"></i></div></div></div>';}
