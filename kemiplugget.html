}
function refreshHead(){var a=byId(V.area);var el=$("#areaProg");if(el)el.outerHTML=areaHead(a);updTotal();}

/* ---------- Kortlek ---------- */
function buildDeck(a,review){
  var k=S.cards[a.id]||{};
  var q=a.cards.map(function(_,i){return i;}).filter(function(i){return review||!k[i];});
  var hi=shuffle(q.filter(function(i){return !a.cards[i].ej;})),lo=shuffle(q.filter(function(i){return a.cards[i].ej;}));
  D={area:a.id,queue:hi.concat(lo),flipped:false,review:!!review,seen:0};
}
function deckHTML(a){
  if(!D||D.area!==a.id)buildDeck(a,false);
  var p=prog(a);
  if(!D.queue.length){
    return '<div class="empty stack"><div><h3>'+(D.review?'Repetition klar':'Alla kort kan du!')+'</h3><p class="hint" style="margin:0">'+(p.qo<p.qt?'Fortsätt med frågorna för att bli helt klar med området.':'Snyggt jobbat.')+'</p></div><div class="row-btns">'+(p.qo<p.qt?'<button class="btn primary" data-act="tab" data-tab="fragor">Till frågorna</button>':'')+'<button class="btn" data-act="review">Repetera alla kort</button></div><div><button class="linkbtn" data-act="reset-cards">Börja om korten från noll</button></div></div>';
  }
  var c=a.cards[D.queue[0]];
  var term=c.svg?'<div class="kind">Farosymbol</div><div style="margin-top:8px">'+haz(c.svg)+'</div>':'<span class="sticky">'+c.t+'</span>';
  var front,back;
  if(!S.reverse){
    front='<div class="kind">Begrepp'+(c.ej?' · <span class="lowtxt">ej på provet</span>':'')+'</div><div class="content">'+term+'</div><div class="note">Tryck för att vända</div>';
    back='<div class="content deftext">'+(c.svg?'<b class="term">'+c.t+'</b>':'<b class="term">'+c.t+'</b>')+c.d+'</div>';
  }else{
    front='<div class="kind">Vilket begrepp?</div><div class="content revtext">'+(c.svg?haz(c.svg):c.d.replace(new RegExp(c.t.replace(/<[^>]+>/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'…'))+'</div><div class="note">Tryck för att vända</div>';
    back='<div class="kind">Svar</div><div class="content">'+(c.svg?'<span class="sticky">'+c.t+'</span><p class="deftext" style="margin-top:14px">'+c.d+'</p>':'<span class="sticky">'+c.t+'</span>')+'</div>';
  }
  var left=D.queue.length;
  var h='<div class="stack">';
  h+='<div class="deckmeta"><span>'+(D.review?'Repetition · ':'')+left+' kort kvar</span><span>Du kan '+p.kc+' av '+p.kt+'</span></div>';
  h+='<div class="flash'+(D.flipped?' flipped':'')+'" id="flash" role="button" tabindex="0" aria-label="Vänd kortet" data-act="flip"><div class="inner"><div class="face">'+front+'</div><div class="face backside">'+back+'</div></div></div>';
  h+='<div class="judge"><button class="btn bad" data-act="again">Öva mer</button><button class="btn ok" data-act="know">Kan!</button></div>';
  h+='<div class="tools"><button class="btn small ghost" data-act="reverse" aria-pressed="'+S.reverse+'">'+(S.reverse?'Visa begreppet först':'Visa förklaringen först')+'</button><button class="btn small ghost" data-act="shuffle">Blanda</button></div>';
  h+='</div>';
  return h;
}
function renderPane(){var a=byId(V.area);$("#pane").innerHTML=V.tab==="kort"?deckHTML(a):qsHTML(a);}

function onKnow(){
  var a=byId(V.area);if(!D||!D.queue.length)return;
  var i=D.queue.shift();
  if(!D.review){S.cards[a.id]=S.cards[a.id]||{};S.cards[a.id][i]=1;save();}
  D.flipped=false;streak++;
  if(streak===5)toast("<b>Kedjereaktion!</b> Fem kort i rad.");
  if(streak===10)toast("<b>Tio i rad!</b> Psst… testa koden <b>H2O</b> i hemliga labbet.");
  if(streak===25)toast("<b>25 i rad!</b> Du reagerar snabbare än knallgas.");
  renderPane();refreshHead();checkDone(a);
}
function onAgain(){
  if(!D||!D.queue.length)return;
  var i=D.queue.shift();D.queue.splice(Math.min(3,D.queue.length),0,i);D.flipped=false;streak=0;renderPane();
}
function flip(){D.flipped=!D.flipped;var f=$("#flash");if(f)f.classList.toggle("flipped",D.flipped);}

/* ---------- Frågor ---------- */
function qsHTML(a){
  var h='<div class="stack"><div class="qfilter"><span>'+qok(a)+' av '+a.qs.length+' klara</span><label class="switch"><input type="checkbox" id="hideDone" '+(S.hideDone?'checked':'')+'> Dölj klara frågor</label></div>';
  var n=0,hdr=false;
  a.qs.forEach(function(q,i){if(q.ej)return;var st=(S.qs[a.id]||{})[i];n++;if(S.hideDone&&st==="ok")return;h+=qHTML(a,q,i,n);});
  a.qs.forEach(function(q,i){if(!q.ej)return;var st=(S.qs[a.id]||{})[i];n++;if(!hdr){h+='<div class="lowhead"><b>Lägre prio</b> · ingår inte i provet</div>';hdr=true;}if(S.hideDone&&st==="ok")return;h+=qHTML(a,q,i,n);});
  if(S.hideDone&&qok(a)===a.qs.length)h+='<div class="empty"><h3>Alla frågor klara!</h3><p class="hint" style="margin:0">Stäng av filtret för att se dem igen.</p></div>';
  h+='<div><button class="linkbtn" data-act="reset-qs">Börja om frågorna från noll</button></div></div>';
  return h;
}
function qHTML(a,q,i,n){
  if(n==null){n=0;if(q.ej){n=a.qs.filter(function(z){return !z.ej;}).length;for(var y=0;y<=i;y++)if(a.qs[y].ej)n++;}else{n=0;for(var w=0;w<=i;w++)if(!a.qs[w].ej)n++;}}
  var st=(S.qs[a.id]||{})[i];var key=a.id+":"+i;var u=UI[key]||{};
  var chip=st==="ok"?'<span class="chip ok">Klar</span>':st==="again"?'<span class="chip again">Öva mer</span>':'';
  var h='<article class="q" id="q-'+i+'" data-st="'+(st||'')+'"><div class="q-head"><span class="q-kind">'+n+' · '+(KIND[q.k]||'')+'</span><span class="chips">'+(q.ej&&!a.ej?'<span class="chip low">Ej på provet</span>':'')+chip+'</span></div>';
  if(q.svg)h+='<div>'+haz(q.svg).replace('class="hz"','class="hz hzq"')+'</div>';
  if(q.fig)h+='<div class="qfig">'+q.fig+'</div>';
  h+='<p class="q-text">'+q.q+'</p>';
  if(q.k==="tf"){
    var picked=u.pick!=null;
    h+='<div class="opts two">';
    [true,false].forEach(function(v,j){var cls="";if(picked){if(v===q.tf)cls=" right";else if(u.pick===j)cls=" wrong";}
      h+='<button class="opt'+cls+'" data-act="tf" data-i="'+i+'" data-j="'+j+'"'+(picked?' disabled':'')+'>'+(v?'Rätt':'Fel')+'</button>';});
    h+='</div>';
    if(picked){var ok=([true,false][u.pick]===q.tf);
      h+='<div class="answer"><p class="feedback '+(ok?'ok':'bad')+'">'+(ok?'Rätt svar!':'Inte riktigt. Påståendet är '+(q.tf?'rätt':'fel')+'.')+'</p><p>'+q.why+'</p></div>';
      if(!ok)h+='<div class="row-btns"><button class="btn small" data-act="retry" data-i="'+i+'">Försök igen</button></div>';}
  }else if(q.opts){
    var picked2=u.pick!=null;var multi=q.multi;
    h+='<div class="opts">';
    q.opts.forEach(function(o,j){var cls="";var right=multi?multi.indexOf(j)>-1:j===q.c;
      if(picked2){if(right)cls=" right";else if(u.pick===j)cls=" wrong";}
      h+='<button class="opt'+cls+'" data-act="mc" data-i="'+i+'" data-j="'+j+'"'+(picked2?' disabled':'')+'>'+o+'</button>';});
    h+='</div>';
    if(picked2){var ok2=multi?multi.indexOf(u.pick)>-1:u.pick===q.c;
      h+='<div class="answer"><p class="feedback '+(ok2?'ok':'bad')+'">'+(ok2?(multi?'Ja! Fler svar stämmer, se förklaringen.':'Rätt svar!'):'Inte riktigt.')+'</p><p>'+q.why+'</p></div>';
      if(!ok2)h+='<div class="row-btns"><button class="btn small" data-act="retry" data-i="'+i+'">Försök igen</button></div>';}
  }else{
    if(!u.rev){h+='<div class="row-btns"><button class="btn primary" data-act="reveal" data-i="'+i+'">Visa svar</button></div><p class="hint" style="margin:-4px 0 0">Tänk ut ditt svar först, säg det högt eller skriv ner det.</p>';}
    else{h+='<div class="answer">'+q.a+'</div><p class="hint" style="margin:0">Hur gick det jämfört med facit?</p><div class="row-btns"><button class="btn bad" data-act="self-again" data-i="'+i+'">Öva mer</button><button class="btn ok" data-act="self-ok" data-i="'+i+'">Jag kunde det</button></div>';}
  }
  h+='</article>';return h;
}
function setQ(a,i,v){S.qs[a.id]=S.qs[a.id]||{};if(v==null)delete S.qs[a.id][i];else S.qs[a.id][i]=v;save();}
function updQ(i){var a=byId(V.area);var el=$("#q-"+i);if(el)el.outerHTML=qHTML(a,a.qs[i],i);var f=$(".qfilter span");if(f)f.textContent=qok(a)+" av "+a.qs.length+" klara";refreshHead();checkDone(a);}

/* ---------- Klart & upplåsning ---------- */
function checkDone(a){
  var p=prog(a);
  if(p.done&&S.unlocked.indexOf(a.id)<0){
    S.unlocked.push(a.id);save();
    setTimeout(function(){burst();showUnlock(a);},350);
  }
}
function showUnlock(a){
  var main=AREAS.filter(function(x){return x.letter;});
  var have=main.filter(function(x){return S.unlocked.indexOf(x.id)>-1;}).length;
  var code=main.map(function(x){return S.unlocked.indexOf(x.id)>-1?x.letter:"_";}).join(" ");
  modal('<h2>'+esc(a.title)+' är klart!</h2><p style="margin:0">Du har låst upp ett nytt grundämne.</p><div class="bigtile"><small>'+a.el.z+'</small><b>'+a.el.s+'</b><small>'+a.el.n+'</small></div><p style="margin:0">'+esc(a.el.f)+'</p>'+(a.letter?'<p style="margin:0">Hemlig bokstav: <span class="letter">'+a.letter+'</span></p><p class="mono" style="margin:0;letter-spacing:.15em">'+code+'</p>'+(have===main.length?'<p style="margin:0"><b>Alla bokstäver hittade!</b> Skriv ordet i hemliga labbet.</p>':''):'<p style="margin:0">Bonusstjärna för ett extraområde: <b>★</b></p>')+'<button class="btn primary" data-act="close">Fortsätt</button>');
}
function showFact(a){modal('<div class="bigtile"><small>'+a.el.z+'</small><b>'+a.el.s+'</b><small>'+a.el.n+'</small></div><h2>'+a.el.n+'</h2><p style="margin:0">'+esc(a.el.f)+'</p>'+(a.letter?'<p style="margin:0">Bokstav: <span class="letter">'+a.letter+'</span></p>':'')+'<button class="btn primary" data-act="close">Stäng</button>');}

/* ---------- Modal & toast ---------- */
function modal(html){var m=$("#modal");m.innerHTML='<div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';m.hidden=false;var b=m.querySelector("button,input");if(b)b.focus();}
function closeModal(){var m=$("#modal");m.hidden=true;m.innerHTML="";}
function toast(html){var t=document.createElement("div");t.className="toast";t.innerHTML=html;$("#toasts").appendChild(t);setTimeout(function(){t.remove();},3800);}

/* ---------- Konfetti (grundämnessymboler) ---------- */
var fx=$("#fx"),ctx=fx.getContext("2d"),parts=[],raf=null;
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeFx(){var d=window.devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);}
function burst(labels,count,rain){
  if(reduce)return;sizeFx();
  labels=labels||["H","He","Li","C","N","O","Na","Cu","Fe","Au","Ag","Cl","Ca","S"];
  var cols=["#2346d6","#f5d63d","#17845a","#c8432c","#7f97ff","#e3b341"];
  for(var i=0;i<(count||70);i++){parts.push({x:rain?Math.random()*innerWidth:innerWidth/2+(Math.random()-.5)*80,y:rain?-20-Math.random()*innerHeight*.6:innerHeight*.45,vx:rain?0:(Math.random()-.5)*9,vy:rain?2+Math.random()*3:-4-Math.random()*8,r:(Math.random()-.5)*.3,a:Math.random()*6,t:labels[i%labels.length],c:cols[i%cols.length],life:0});}
  if(!raf)raf=requestAnimationFrame(step);
}
function step(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.y<innerHeight+40&&p.life<400;});
  parts.forEach(function(p){p.vy+=0.18;p.x+=p.vx;p.y+=p.vy;p.a+=p.r;p.life++;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-13,-11,26,22);ctx.fillStyle=(p.c==="#f5d63d"||p.c==="#e3b341")?"#231e00":"#fff";ctx.font="700 12px ui-monospace,Menlo,monospace";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(p.t,0,1);ctx.restore();});
  if(parts.length)raf=requestAnimationFrame(step);else{raf=null;ctx.clearRect(0,0,innerWidth,innerHeight);}
}

/* ---------- Hemliga koder ---------- */
function applyGold(){if(S.gold)document.documentElement.setAttribute("data-gold","1");else document.documentElement.removeAttribute("data-gold");}
function allMain(){return AREAS.filter(function(x){return x.letter;}).every(function(x){return S.unlocked.indexOf(x.id)>-1;});}
function runCode(raw){
  var c=raw.toUpperCase().replace(/\s+/g,"").replace(/₂/g,"2");
  S.eggs[c]=1;save();
  if(c==="H2O"){burst(["H₂O","H₂O","💧"],60,true);toast("<b>Det regnar!</b> Vattnets kretslopp i full gång.");return;}
  if(c==="112"){toast("<b>Rädda · Varna · Larma 112 · Släcka.</b> Du kan minnesregeln!");burst(["🔥","O₂","Δ"],30);return;}
  if(c==="KHEMS"){toast("<b>Egypterna nickar gillande.</b> Ordet kemi kan komma från khems.");return;}
  if(c==="AU"||c==="GULD"){S.gold=!S.gold;save();applyGold();toast(S.gold?"<b>Alkemisternas dröm!</b> Allt blev guld.":"Guldet blev vanlig metall igen.");if(S.gold)burst(["Au","Au","Au"],50);if(V.view==="home")renderHome();return;}
  if(c==="C+O2"||c==="CO2"||c==="C+O2→CO2"){toast("<b>C + O₂ → CO₂</b> Kolet reagerade med syret. Ingenting försvann!");return;}
  if(c==="YTTERBY"){S.eggs.ytterby=1;save();toast("<b>Fyra grundämnen från en enda by!</b> Yttrium, ytterbium, terbium och erbium. Du är en riktig periodexpert.");burst(["Y","Yb","Tb","Er"],90);return;}
  if(c==="MENDELEJEV"){toast("<b>Dmitrij gillar ordning.</b> 118 grundämnen och jakten på nummer 119 pågår.");burst(["119","?"],20);return;}
  if(c==="FLEMING"||c==="PENICILLIN"){toast("<b>Upptäckt av en slump!</b> Ibland är misstag guld värda.");return;}
  if(c==="MOLEKYL"){
    if(allMain()){showDiploma(false);burst(null,120);}
    else toast("<b>Rätt kod!</b> Men diplomet kräver att alla sju provområden är klara. Kämpa på!");
    return;}
  if(c==="BERZELIUS"){
    if(S.unlocked.length>=AREAS.length){showDiploma(true);burst(["Au","Au","★"],140);}
    else toast("<b>Hemlig mästarkod!</b> Den fungerar när alla tio områden är klara, även extraområdena.");
    return;}
  toast("Inget hände. Fel blandning, kanske?");
}
function showDiploma(master){
  var d=new Date().toLocaleDateString("sv-SE",{year:"numeric",month:"long",day:"numeric"});
  modal('<div class="diploma"><div class="eyebrow">Kemiplugget</div><h2>'+(master?'Mästarkemist':'Diplom')+'</h2><p style="margin:8px 0 0">Härmed intygas att</p><div class="nm" id="dipName">'+(S.name?esc(S.name):'Ditt namn')+'</div><p style="margin:0">har klarat '+(master?'<b>alla</b> områden, även extraområdena,':'alla provområden')+' i <b>Kemins grunder</b> och vattnets kretslopp. '+(master?'Berzelius hade bugat sig.':'Mendelejev hade varit stolt.')+'</p><p style="margin:0"></p><p class="hint" style="margin:10px 0 0">'+d+'</p></div><label class="hint" for="nameIn" style="text-align:left">Skriv ditt namn på diplomet</label><input type="text" id="nameIn" value="'+esc(S.name||"")+'" maxlength="40"><p class="hint" style="margin:0">Ta en skärmbild och visa!</p><button class="btn primary" data-act="close">Stäng</button>');
  var n=$("#nameIn");n.addEventListener("input",function(){S.name=n.value;save();$("#dipName").textContent=n.value||"Ditt namn";});
}

/* ---------- Navigering & händelser ---------- */
function go(view,area,tab){V.view=view;if(area)V.area=area;if(tab)V.tab=tab;if(view==="area"){if(!D||D.area!==V.area)D=null;setLast();renderArea();}else renderHome();updTotal();window.scrollTo(0,0);}

var logoTaps=0,logoTimer=null;
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(!b){if(e.target===$("#modal"))closeModal();return;}
  var act=b.getAttribute("data-act"),a=V.area?byId(V.area):null,i=+b.getAttribute("data-i"),j=+b.getAttribute("data-j");
  switch(act){
    case "open":go("area",b.getAttribute("data-id"),"kort");break;
    case "continue":go("area",S.last.area,S.last.tab);break;
    case "home":go("home");break;
    case "tab":V.tab=b.getAttribute("data-tab");setLast();renderArea();break;
    case "flip":flip();break;
    case "know":onKnow();break;
    case "again":onAgain();break;
    case "shuffle":(function(){var hi=D.queue.filter(function(i){return !a.cards[i].ej;}),lo=D.queue.filter(function(i){return a.cards[i].ej;});D.queue=shuffle(hi).concat(shuffle(lo));})();D.flipped=false;renderPane();toast("Korten är blandade.");break;
    case "reverse":S.reverse=!S.reverse;save();D.flipped=false;renderPane();break;
    case "review":buildDeck(a,true);renderPane();break;
    case "reset-cards":modal('<h2>Börja om korten?</h2><p style="margin:0">Alla kort i <b>'+esc(a.title)+'</b> markeras som ej klara.</p><div class="row-btns"><button class="btn" data-act="close">Avbryt</button><button class="btn primary" data-act="do-reset-cards">Börja om</button></div>');break;
    case "do-reset-cards":S.cards[a.id]={};save();buildDeck(a,false);closeModal();renderArea();break;
    case "reset-qs":modal('<h2>Börja om frågorna?</h2><p style="margin:0">Alla frågor i <b>'+esc(a.title)+'</b> markeras som ej klara.</p><div class="row-btns"><button class="btn" data-act="close">Avbryt</button><button class="btn primary" data-act="do-reset-qs">Börja om</button></div>');break;
    case "do-reset-qs":S.qs[a.id]={};save();Object.keys(UI).forEach(function(k){if(k.indexOf(a.id+":")===0)delete UI[k];});closeModal();renderArea();break;
    case "reveal":UI[a.id+":"+i]={rev:true};updQ(i);break;
    case "self-ok":setQ(a,i,"ok");UI[a.id+":"+i]={rev:true};updQ(i);break;
    case "self-again":setQ(a,i,"again");delete UI[a.id+":"+i];updQ(i);break;
    case "tf":var q=a.qs[i];var ok=([true,false][j]===q.tf);UI[a.id+":"+i]={pick:j};setQ(a,i,ok?"ok":"again");updQ(i);break;
    case "mc":var q2=a.qs[i];var ok2=q2.multi?q2.multi.indexOf(j)>-1:j===q2.c;UI[a.id+":"+i]={pick:j};setQ(a,i,ok2?"ok":"again");updQ(i);break;
    case "retry":delete UI[a.id+":"+i];updQ(i);break;
    case "fact":showFact(byId(b.getAttribute("data-id")));break;
    case "close":closeModal();if(V.view==="home")renderHome();break;
    case "ask-reset":modal('<h2>Nollställa allt?</h2><p style="margin:0">Alla kort, frågor och din samling försvinner. Det går inte att ångra.</p><div class="row-btns"><button class="btn" data-act="close">Avbryt</button><button class="btn bad" data-act="do-reset-all">Nollställ</button></div>');break;
    case "do-reset-all":S=fresh();save();D=null;UI={};applyGold();closeModal();renderHome();updTotal();toast("Allt är nollställt. Lycka till!");break;
    case "gold-off":S.gold=false;save();applyGold();renderHome();break;
  }
});
document.addEventListener("change",function(e){if(e.target.id==="hideDone"){S.hideDone=e.target.checked;save();renderPane();}});
document.addEventListener("submit",function(e){if(e.target.id==="codeForm"){e.preventDefault();var inp=$("#code");if(inp.value.trim()){runCode(inp.value.trim());inp.value="";inp.blur();}}});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!$("#modal").hidden){closeModal();return;}
  if(V.view!=="area"||V.tab!=="kort"||!$("#modal").hidden)return;
  var tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;
  if(e.key===" "||e.key==="Enter"){if(e.target.closest&&e.target.closest("button"))return;e.preventDefault();flip();}
  else if(e.key==="ArrowRight"||e.key==="2")onKnow();
  else if(e.key==="ArrowLeft"||e.key==="1")onAgain();
});

// Påskägg: tryck på atomen i loggan 7 gånger
$("#logo").addEventListener("click",function(){
  logoTaps++;clearTimeout(logoTimer);logoTimer=setTimeout(function(){logoTaps=0;},1500);
  if(logoTaps>=7){logoTaps=0;var l=$("#logo");l.classList.add("split");burst(["p⁺","n⁰","e⁻"],45);toast("<b>Du splittrade atomen!</b> Atomos betyder odelbar… grekerna hade fel.");setTimeout(function(){l.classList.remove("split");},2200);}
  else if(logoTaps===1){go("home");}
});

/* ---------- Start ---------- */
applyGold();renderHome();updTotal();
(function(){var h=new Date().getHours();if(h>=22||h<5)setTimeout(function(){toast("<b>Sent ute?</b> Även kemister behöver sova. Allt du gjort är sparat.");},900);})();
window.addEventListener("resize",function(){if(raf)sizeFx();});
})();
</script>
