<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kemiplugget</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kemiplugget">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: en smal labbjournal. Områdena är rutor i ett eget "periodiskt system", begreppen är gula lappar som i boken. */
:root{
  --bg:#edf1f4; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#13202c; --muted:#56636f; --line:#d3dbe2;
  --accent:#2346d6; --accent-ink:#ffffff; --accent-soft:#dfe5fb;
  --tag:#f5d63d; --tag-ink:#2a2400;
  --ok:#17845a; --ok-soft:#dcf2e7; --bad:#c8432c; --bad-soft:#fbe3dd;
  --t1:#dfe6fb; --t2:#d9f0e2; --t3:#fbefb8;
  --shadow:0 1px 2px rgba(19,32,44,.06),0 6px 20px rgba(19,32,44,.07);
  --f-display:"Familjen Grotesk","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#17212b; --surface-2:#1c2833; --ink:#e5ecf2; --muted:#94a3b1; --line:#2b3844;
  --accent:#7f97ff; --accent-ink:#0a1020; --accent-soft:#1f2a4c;
  --tag:#e9cb33; --tag-ink:#231e00;
  --ok:#47c18b; --ok-soft:#163327; --bad:#ff7b64; --bad-soft:#3a1d18;
  --t1:#1e2947; --t2:#173326; --t3:#3a3314;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#17212b; --surface-2:#1c2833; --ink:#e5ecf2; --muted:#94a3b1; --line:#2b3844;
  --accent:#7f97ff; --accent-ink:#0a1020; --accent-soft:#1f2a4c;
  --tag:#e9cb33; --tag-ink:#231e00;
  --ok:#47c18b; --ok-soft:#163327; --bad:#ff7b64; --bad-soft:#3a1d18;
  --t1:#1e2947; --t2:#173326; --t3:#3a3314;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* Påskägg: guldläge (alkemisternas dröm) */
:root[data-gold="1"]{ --accent:#b07d0c; --accent-ink:#fffaf0; --accent-soft:#f6ead0; --t1:#f6ead0; --t2:#f1e4c4; }
@media (prefers-color-scheme: dark){:root[data-gold="1"]:not([data-theme="light"]){ --accent:#e3b341; --accent-ink:#1f1600; --accent-soft:#3a2e12; --t1:#33290f; --t2:#2e2610; }}
:root[data-theme="dark"][data-gold="1"]{ --accent:#e3b341; --accent-ink:#1f1600; --accent-soft:#3a2e12; --t1:#33290f; --t2:#2e2610; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
sub{font-size:.7em}
.mono{font-family:var(--f-mono)}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;min-height:44px}
.logo svg{width:34px;height:34px;flex:none}
.logo b{font-family:var(--f-display);font-size:1.2rem;letter-spacing:-.01em}
.logo .orb{transform-origin:50% 50%;animation:spin 9s linear infinite}
.logo .orb2{animation-duration:13s;animation-direction:reverse}
.logo.split .orb{animation-duration:.35s}
.logo.split .nuc{animation:wobble .4s ease-in-out 5}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wobble{50%{transform:scale(1.4)}}
.top .total{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{width:72px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

main{padding-block:20px 40px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:6px 0 0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:16px}

/* Hemsidan */
.hero h1{font-size:clamp(1.8rem,6vw,2.5rem);letter-spacing:-.02em}
.continue{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);min-height:64px}
.continue small{display:block;opacity:.85;font-size:.82rem}
.continue b{font-family:var(--f-display);font-size:1.1rem}
.continue .arrow{margin-left:auto;font-size:1.4rem}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:8px}
.sec-h h2{font-size:1.2rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px 14px;cursor:pointer;min-height:150px;overflow:hidden;background:var(--t1);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile.k2{background:var(--t2)}
.tile.k3{background:var(--t3)}
.tile .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .sym{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:1;margin-top:6px;letter-spacing:-.02em}
.tile .nm{font-weight:700;font-size:.92rem;line-height:1.25;margin-top:auto}
.tile .pg{font-size:.75rem;color:var(--muted)}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(127,127,127,.18)}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.done .bar i{background:var(--ok)}
.tile .badge{position:absolute;top:30px;right:10px;background:var(--ok);color:var(--surface);font-size:.7rem;font-weight:700;border-radius:99px;padding:2px 8px}

.collection{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);color:var(--muted);font-size:.8rem;background:transparent;padding:0;cursor:default}
.slot.on{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.slot.on b{font-family:var(--f-display);font-size:clamp(.9rem,3.6vw,1.3rem);line-height:1}
.slot.on span{font-size:.62rem;color:var(--accent);font-weight:700}
.slot.bonus{border-color:var(--tag)}
.hint{font-size:.85rem;color:var(--muted)}

.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.lab form{display:flex;gap:8px;margin-top:10px}
.lab input{flex:1;min-width:0;font:inherit;font-size:16px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.95rem;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:0 12px;font-size:.85rem;font-weight:600}
.btn:disabled{opacity:.45}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px 0;font-size:.85rem}

/* Områdessida */
.back{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 0;min-height:44px}
.area-head{display:flex;gap:14px;align-items:flex-start}
.mini{flex:none;width:68px;height:68px;border-radius:10px;border:1px solid var(--line);background:var(--t1);display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px}
.mini.k2{background:var(--t2)} .mini.k3{background:var(--t3)}
.mini small{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.mini b{font-family:var(--f-display);font-size:1.7rem;line-height:1}
.area-head h1{font-size:clamp(1.4rem,5vw,1.9rem);letter-spacing:-.01em}
.area-head > div{min-width:0}
.progline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pbox .lbl{font-size:.8rem;color:var(--muted)}
.pbox .num{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.pbox .meter{width:100%;margin-top:6px}
.pbox.full .meter i{background:var(--ok)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:44px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Begreppskort */
.deckmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.flash{display:block;width:100%;height:clamp(270px,48vh,380px);perspective:1200px;-webkit-perspective:1200px;cursor:pointer;outline-offset:4px;border-radius:20px}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg);-webkit-transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px;overflow:hidden}
.face.backside{transform:rotateY(180deg);-webkit-transform:rotateY(180deg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.face .content{margin:auto 0;width:100%;text-align:center}
.face .note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}
.face .kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sticky{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-weight:600;font-size:clamp(1.5rem,6.5vw,2.1rem);line-height:1.15;padding:10px 18px;transform:rotate(-2deg);box-shadow:0 2px 0 rgba(0,0,0,.12);max-width:100%;overflow-wrap:anywhere}
.deftext{font-size:1.08rem;text-align:left;line-height:1.55}
.deftext b.term{display:block;font-family:var(--f-display);font-size:1.3rem;margin-bottom:6px}
.revtext{font-size:1.1rem;line-height:1.5;text-align:left}
.hz{width:min(150px,40vw);height:auto;display:block;margin:0 auto}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge .btn{min-height:56px;font-size:1.05rem}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center}
.empty h3{font-size:1.3rem;margin-bottom:6px}

/* Frågor */
.qfilter{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;min-height:44px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.q[data-st="ok"]{border-color:var(--ok)}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-kind{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.again{background:var(--bad-soft);color:var(--bad)}
.q-text{margin:0;font-weight:700;font-size:1.05rem}
.answer{background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.answer p{margin:0 0 6px} .answer p:last-child{margin:0}
.answer ul,.answer ol{margin:4px 0;padding-left:1.2em}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;justify-content:center}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-weight:600}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:1}
.q .hzq{width:110px;height:auto}

/* Fotnot & labb */
.foot{color:var(--muted);font-size:.8rem;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* Toast, modal, konfetti */
#toasts{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;max-width:520px;font-size:.95rem;box-shadow:var(--shadow);animation:pop .3s ease-out}
.toast b{font-family:var(--f-display)}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
#modal{position:fixed;inset:0;z-index:70;background:rgba(10,16,24,.55);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);color:var(--ink);border-radius:20px;padding:22px;max-width:440px;width:100%;max-height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;text-align:center}
.dialog h2{font-size:1.4rem}
.bigtile{width:120px;height:120px;margin:0 auto;border-radius:14px;border:2px solid var(--ink);background:var(--tag);color:var(--tag-ink);display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;text-align:left}
.bigtile small{font-family:var(--f-mono);font-size:.75rem}
.bigtile b{font-family:var(--f-display);font-size:3rem;line-height:1}
.letter{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:1.4rem;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:2px 12px}
.diploma{border:3px double var(--accent);border-radius:14px;padding:18px;background:var(--surface-2)}
.diploma .nm{font-family:var(--f-display);font-size:1.6rem;font-weight:700;margin:6px 0;overflow-wrap:anywhere}
.dialog input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);width:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65}

.ptlink{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:64px}
.ptlink .ptsym{flex:none;width:48px;height:48px;border-radius:8px;background:var(--tag);color:var(--tag-ink);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.ptlink b{display:block;font-family:var(--f-display)}
.ptlink small{display:block;color:var(--muted);font-size:.85rem}
.ptlink .arrow{margin-left:auto;font-size:1.3rem;color:var(--accent)}
.fig{width:100%;max-width:300px;height:auto;display:block;margin:12px auto 0;color:var(--ink)}
.fig.wide{max-width:340px;border-radius:10px}
.pf{width:170px;max-width:100%;height:auto;display:block;color:var(--ink)}
.qfig{display:flex;justify-content:center}
.fasfig{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
.fasfig span{color:var(--accent);font-weight:700}
.fasgrid{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:10px;font-family:var(--f-mono);text-align:center}
.fasgrid b{background:var(--accent-soft);border-radius:8px;padding:4px 14px}
.fasgrid span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip.low{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.lowtxt{color:var(--bad)}
.lowhead{margin-top:10px;padding-top:14px;border-top:2px dashed var(--line);color:var(--muted);font-size:.95rem}
.lownote{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--muted)}
.provbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.provbox p{margin:4px 0 0;font-size:.95rem}
.tile.lowtile{opacity:.72;background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-width:420px){
  .collection{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="logo" id="logo" aria-label="Kemiplugget, till startsidan">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <g class="orb"><ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="37" cy="20" r="2.4" fill="var(--accent)"/></g>
        <g class="orb orb2"><ellipse cx="20" cy="20" rx="7" ry="17" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="20" cy="3" r="2.4" fill="var(--accent)"/></g>
        <circle class="nuc" cx="20" cy="20" r="4.5" fill="var(--tag)" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <b>Kemiplugget</b>
    </button>
    <div class="total" aria-label="Total framgång"><span id="totalPct">0 %</span><div class="meter"><i id="totalBar" style="width:0"></i></div></div>
  </div>
