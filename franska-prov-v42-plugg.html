<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Franska v 42</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a French "cahier" (Seyès-ruled notebook) — one column, cards pinned on the page, sticky progress header */
:root{
  --paper:#fbfcff; --rule:#d8e2f5; --rule-strong:#b9c9ea; --margin:#f2a9a9;
  --ink:#1d2b5c; --ink-soft:#56628c; --card:#ffffff; --line:#dfe5f3;
  --bleu:#2f54d6; --bleu-soft:#e6ecff;
  --perroquet:#2e8b4e; --perroquet-soft:#e2f4e7;
  --rouge:#d13a3a; --rouge-soft:#fde8e6;
  --soleil:#f2b705; --soleil-soft:#fff4cc;
  --shadow:0 1px 0 rgba(29,43,92,.06),0 6px 18px -10px rgba(29,43,92,.35);
  --f-display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17201c; --rule:#1f2b26; --rule-strong:#26352f; --margin:#5a2e2e;
  --ink:#eef3ea; --ink-soft:#a8b5ad; --card:#1f2a25; --line:#2f3d37;
  --bleu:#8eaaff; --bleu-soft:#24305a;
  --perroquet:#6fd492; --perroquet-soft:#1e3a29;
  --rouge:#ff8a80; --rouge-soft:#45231f;
  --soleil:#ffd257; --soleil-soft:#3d3416;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17201c; --rule:#1f2b26; --rule-strong:#26352f; --margin:#5a2e2e;
  --ink:#eef3ea; --ink-soft:#a8b5ad; --card:#1f2a25; --line:#2f3d37;
  --bleu:#8eaaff; --bleu-soft:#24305a;
  --perroquet:#6fd492; --perroquet-soft:#1e3a29;
  --rouge:#ff8a80; --rouge-soft:#45231f;
  --soleil:#ffd257; --soleil-soft:#3d3416;
  --shadow:0 6px 18px -10px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font:17px/1.5 var(--f-body);
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),
    linear-gradient(var(--rule-strong) 1px,transparent 1px),
    linear-gradient(var(--rule) 1px,transparent 1px);
  background-size:100% 100%,100% 32px,100% 8px;
  background-attachment:local;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px;border-radius:8px}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:50%;border:none;background:var(--perroquet-soft);font-size:24px;display:grid;place-items:center;flex:none;transition:transform .2s}
.logo:active{transform:scale(.9) rotate(-12deg)}
.brand h1{font:800 22px/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand .sub{font-size:13px;color:var(--ink-soft)}
.brand .grow{flex:1;min-width:0}
.back{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
.totbar{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:14px;border-radius:999px;background:var(--bleu-soft);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--bleu),var(--perroquet));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.totnum{font-weight:700;font-size:14px;white-space:nowrap}
.totnum small{font-weight:400;color:var(--ink-soft)}

/* home */
.hero{margin:18px 0 6px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:800 26px/1 var(--f-display)}
.ring .pct small{display:block;font:400 12px/1.2 var(--f-body);color:var(--ink-soft)}
.hero h2{font:800 24px/1.15 var(--f-display);margin:0 0 4px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-soft);font-size:15px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--perroquet-soft);color:var(--perroquet);border-color:transparent}
.chip.left{background:var(--soleil-soft);border-color:transparent}
.chip.egg{background:var(--bleu-soft);color:var(--bleu);border-color:transparent}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 8px}
.btn{border:none;border-radius:14px;padding:13px 14px;font-weight:700;font-size:16px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line);text-align:center}
.btn.primary{background:var(--bleu);color:#fff;border-color:transparent}
:root[data-theme="dark"] .btn.primary{color:#0f1630}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1630}}
.btn.green{background:var(--perroquet);color:#fff;border-color:transparent}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5}

.group-h{font:600 26px/1 var(--f-hand);color:var(--rouge);margin:22px 0 8px 4px;transform:rotate(-1deg)}
.list{display:flex;flex-direction:column;gap:10px}
.sec{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.sec .t{font-weight:700;font-size:17px;min-width:0}
.sec .s{font-size:13px;color:var(--ink-soft);grid-column:1}
.sec .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;grid-row:1/3;grid-column:2;text-align:right}
.sec .n small{display:block;font-weight:400;color:var(--ink-soft);font-size:12px}
.sec .mini{grid-column:1/3;height:6px;border-radius:9px;background:var(--bleu-soft);overflow:hidden;margin-top:4px}
.sec .mini i{display:block;height:100%;background:var(--bleu);border-radius:9px}
.sec.done{border-color:var(--perroquet)}
.sec.done .mini i{background:var(--perroquet)}
.sec.done .n{color:var(--perroquet)}

/* section view */
.tabs{display:flex;gap:6px;margin:16px 0 12px;background:var(--bleu-soft);padding:4px;border-radius:14px}
.tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:10px;font-weight:700;font-size:15px;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sechead h2{font:800 26px/1.15 var(--f-display);margin:16px 0 2px;text-wrap:balance}
.sechead p{margin:0;color:var(--ink-soft);font-size:14px}
.tip{background:var(--soleil-soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.tip b{font-family:var(--f-display)}
.tip table{border-collapse:collapse;margin-top:6px;font-size:15px}
.tip td{padding:2px 14px 2px 0}
.tip td:first-child{color:var(--ink-soft)}
.tip .hand{font-family:var(--f-hand);font-size:21px;color:var(--rouge)}
.rows{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .sv{min-width:0;font-size:15px}
.row .fr{min-width:0;font-weight:700;font-size:16px;border:none;background:none;text-align:left;padding:0}
.row .fr.hid{color:transparent;background:var(--bleu-soft);border-radius:6px;user-select:none}
.row .fr.hid::after{content:"tryck";color:var(--ink-soft);font-weight:400;font-size:12px;padding-left:8px}
.row.ok .sv::before{content:"✓ ";color:var(--perroquet);font-weight:700}
.say{border:none;background:var(--bleu-soft);color:var(--bleu);width:34px;height:34px;border-radius:50%;font-size:15px;flex:none}
.toolrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.link{border:none;background:none;color:var(--bleu);font-weight:700;padding:4px 0}

/* practice */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.streak{color:var(--rouge);font-weight:700}
.prompt-l{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.prompt{font:800 26px/1.2 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.prompt small{display:block;font:400 15px/1.3 var(--f-body);color:var(--ink-soft);margin-top:4px}
.ans{width:100%;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.ans:focus{border-color:var(--bleu);outline:none}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-width:38px;height:38px;font-size:18px;font-weight:700}
.pbtns{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.pbtns .btn{padding:12px}
.fb{border-radius:14px;padding:12px 14px;font-size:16px}
.fb .big{font:600 30px/1 var(--f-hand);display:block;margin-bottom:4px}
.fb.good{background:var(--perroquet-soft)}
.fb.good .big{color:var(--perroquet)}
.fb.bad{background:var(--rouge-soft)}
.fb.bad .big{color:var(--rouge)}
.fb.near{background:var(--soleil-soft)}
.fb .corr{font-weight:700;font-size:19px}
.fb .yours{text-decoration:line-through;text-decoration-color:var(--rouge);color:var(--ink-soft)}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:17px;letter-spacing:.06em;color:var(--bleu)}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts button{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;font-weight:700;font-size:16px}
.opts button.right{border-color:var(--perroquet);background:var(--perroquet-soft)}
.opts button.wrong{border-color:var(--rouge);background:var(--rouge-soft)}
.clockwrap{display:flex;justify-content:center}
.clockwrap svg{width:180px;height:180px;max-width:100%}
.finish{text-align:center;padding:28px 16px}
.finish .big{font:800 34px/1.1 var(--f-display);margin:6px 0}
.finish p{color:var(--ink-soft)}

/* texts */
.dlg{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
.ln{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px;border-radius:10px;border:none;background:none;text-align:left;width:100%}
.ln:active{background:var(--bleu-soft)}
.ln .who{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bleu);padding-top:4px;width:78px;overflow-wrap:anywhere}
.ln .who:empty{width:78px}
.ln .f{font-size:17px;min-width:0}
.ln .sv2{grid-column:2;font-family:var(--f-hand);font-size:21px;line-height:1.15;color:var(--rouge)}
.ln.narr .f{font-style:italic;color:var(--ink-soft)}
.readbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--perroquet)}
.dots i.on{background:var(--perroquet)}
.textpick{display:flex;gap:6px;margin:8px 0 4px}
.textpick button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font-weight:700;font-size:14px}
.textpick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

footer.f{margin-top:36px;text-align:center;color:var(--ink-soft);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
footer.f .sign{font:600 26px/1 var(--f-hand);color:var(--rouge)}
.danger{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-soft)}
.danger.arm{background:var(--rouge);color:#fff;border-color:transparent}

/* toast + fun */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:16px;font-weight:700;max-width:calc(100% - 32px);width:max-content;z-index:30;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.flyer{position:fixed;top:30%;left:-120px;font-size:64px;z-index:26;pointer-events:none;animation:fly 3.6s ease-in-out forwards}
.flyer .bub{position:absolute;left:70px;top:-58px;width:220px;font:600 20px/1.1 var(--f-hand);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:8px 10px}
@keyframes fly{0%{transform:translate(0,0) rotate(-8deg)}30%{transform:translate(45vw,-40px) rotate(6deg)}60%{transform:translate(55vw,20px) rotate(-6deg)}100%{transform:translate(120vw,-120px) rotate(10deg)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px) rotate(-1deg)}40%{transform:translate(7px,-4px) rotate(1deg)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:start}.row{grid-template-columns:1fr auto}.row .sv{grid-column:1/3}}
</style>
</head>
<body>


<header class="top"><div class="in">
  <div class="brand">
    <button class="back" id="backBtn" hidden aria-label="Tillbaka till översikten">‹ Alla</button>

</div></header>

<main class="wrap" id="app"></main>

/* clock language */
const HW=["","une","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","midi"];
function hourWord(h){h=((h-1)%12+12)%12+1; if(h===12) return "midi"; return HW[h]+(h===1?" heure":" heures");}
function frTime(h,m){
  const MW={0:"",5:" cinq",10:" dix",15:" et quart",20:" vingt",25:" vingt-cinq",30:" et demie"};
  const MM={35:" moins vingt-cinq",40:" moins vingt",45:" moins le quart",50:" moins dix",55:" moins cinq"};
  if(m<=30){ const hw=hourWord(h); return "Il est "+hw+(m===30&&hw==="midi"?" et demi":MW[m])+"."; }
  return "Il est "+hourWord(h+1)+MM[m]+".";
}
function svTime(h,m){return (h)+":"+String(m).padStart(2,"0");}
function clockSVG(h,m){
  const ha=((h%12)+m/60)*30, ma=m*6; let t="";
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180, r1=i%5?82:76, r2=86;
    t+=`<line x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}" stroke="var(--ink)" stroke-width="${i%5?1:3}" stroke-linecap="round"/>`;}
  let n="";for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;n+=`<text x="${100+64*Math.sin(a)}" y="${100-64*Math.cos(a)+6}" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)" font-family="var(--f-body)">${i}</text>`;}
  return `<svg viewBox="0 0 200 200" role="img" aria-label="En klocka"><circle cx="100" cy="100" r="96" fill="var(--card)" stroke="var(--rouge)" stroke-width="8"/>${t}${n}
  <line x1="100" y1="100" x2="${100+42*Math.sin(ha*Math.PI/180)}" y2="${100-42*Math.cos(ha*Math.PI/180)}" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="${100+70*Math.sin(ma*Math.PI/180)}" y2="${100-70*Math.cos(ma*Math.PI/180)}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="6" fill="var(--rouge)"/></svg>`;
}

/* build item lists */
S.forEach(sec=>{
  if(sec.type==="clock"){ sec.items = sec.clocks.map(([h,m])=>({q:svTime(h,m), a:frTime(h,m), clock:[h,m]})); }
  else if(sec.type==="text"){ sec.items = []; TX.forEach(t=>{for(let r=1;r<=READS;r++) sec.items.push({text:t.id, n:r});}); }
  else sec.items = sec.items.map(x=>({q:x[0], a:x[1], alt:x[2]||[], show:x[3]||x[1]}));
  sec.items.forEach((it,i)=>it.id=sec.id+"-"+i);
});

function isDone(it){ if(it.text) return (st.reads[it.text]||0)>=it.n; return !!st.done[it.id]; }
function secCount(sec){let d=0;sec.items.forEach(it=>{if(isDone(it))d++;});return [d,sec.items.length];}
function totals(){let d=0,n=0;S.forEach(s=>{const[a,b]=secCount(s);d+=a;n+=b;});return [d,n];}

/* ============ MATCHING ============ */
const NUM={1:"un",2:"deux",3:"trois",4:"quatre",5:"cinq",6:"six",7:"sept",8:"huit",9:"neuf",10:"dix",11:"onze",12:"douze",13:"treize",14:"quatorze",15:"quinze",16:"seize",17:"dix-sept",18:"dix-huit",19:"dix-neuf"};
function norm(s){
  s=(s||"").normalize("NFC").toLowerCase().replace(/[’`´ʼ]/g,"'").replace(/[«»"“”]/g,"")
   .replace(/\s*'\s*/g,"'").replace(/[.,!?…;:]/g," ").replace(/\s+/g," ").trim();
  s=s.replace(/\b1 heure\b/g,"une heure").replace(/\b(\d{1,2})\b/g,(m,d)=>NUM[+d]||d);
  return s;
}
const noAcc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const noArt=s=>s.replace(/^(le |la |les |l'|un |une )/,"");
function check(it,input,sec){
  const u=norm(input); if(!u) return "empty";
  const answers=[it.a,...(it.alt||[])].map(norm);
  for(const a of answers){
    if(u===a) return "ok";
    if(!sec.art && noArt(u)===noArt(a)) return "ok";
  }
  for(const a of answers){

const toastEl=document.getElementById("toast"); let tt;
function toast(msg,ms=2600){toastEl.innerHTML=msg;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),ms);}
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const fx=document.getElementById("fx"), ctx=fx.getContext("2d"); let parts=[], raf=null;
function burst(kind="confetti",n=120){
  if(reduce) return;
  const W=fx.width=innerWidth*devicePixelRatio, H=fx.height=innerHeight*devicePixelRatio;
  const cols=["#2f54d6","#ffffff","#d13a3a","#2e8b4e","#f2b705"];
  const emo={hearts:["❤️","💘","💕"],bread:["🥖","🥐","🧀"],clock:["⏰","🕗","🚌"],boom:["💥","🧪","🔥"]}[kind];
  for(let i=0;i<n;i++) parts.push({x:emo?Math.random()*W:W/2+(Math.random()-.5)*W*.3, y:emo?-40*devicePixelRatio-Math.random()*H*.6:H*.35,
    vx:emo?(Math.random()-.5)*2:(Math.random()-.5)*18, vy:emo?2+Math.random()*4:-Math.random()*16-4, r:Math.random()*6.28, vr:(Math.random()-.5)*.3,
    c:cols[i%cols.length], e:emo?emo[i%emo.length]:null, s:(emo?28:8)*devicePixelRatio, life:0});
  if(!raf) loop();
}
function loop(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.vy+=p.e?.05:.45;p.x+=p.vx*devicePixelRatio*.6;p.y+=p.vy*devicePixelRatio*.6;p.r+=p.vr;p.life++;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
    if(p.e){ctx.font=p.s+"px serif";ctx.fillText(p.e,0,0);} else {ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);}
    ctx.restore();});
  parts=parts.filter(p=>p.y<fx.height+60&&p.life<600);
  if(parts.length) raf=requestAnimationFrame(loop); else {raf=null;ctx.clearRect(0,0,fx.width,fx.height);}
}

function clockOpts(it){
  const [h,m]=it.clock, set=new Set([it.a]);

  shuffle(cands).forEach(([a,b])=>{ if(set.size<4){ const t=frTime(a,b); set.add(t);} });
  return shuffle([...set]);
}

const EGG_WORDS={
  mathilde:()=>{burst("hearts",60);egg("mathilde","❤️ François est amoureux de Mathilde !<br>… men hon är ju med Olivier nu. Pauvre François !");},
  baguette:()=>{burst("bread",60);egg("baguette","🥖 Mmm … le petit déjeuner est prêt !");},

  alexandre:()=>{burst("clock",50);egg("alexandre","⏰ Alexandre est toujours en retard ! Dépêche-toi !!");},
};
function doCheck(){
  const inp=document.getElementById("ansIn"); if(!inp||inp.disabled) return;
  const it=curIt(), sec=curSec(), v=inp.value;
  const key=noAcc(norm(v));
  if(EGG_WORDS[key] && noAcc(norm(it.a))!==key){ EGG_WORDS[key](); inp.value=""; return; }
  const r=check(it,v,sec);
  if(r==="empty"){ inp.focus(); document.getElementById("qcard").classList.add("shake"); setTimeout(()=>document.getElementById("qcard")?.classList.remove("shake"),500); return; }
  if(r==="ok"){
    inp.disabled=true; lockBtns();
    if(P.revealed){ feedback("good","Bien copié !","Nu har du skrivit det en gång. Den kommer tillbaka strax – då ska du kunna den själv."); document.getElementById("fb").querySelectorAll("button").forEach(b=>b.remove()); nextBtn(); return; }
    if(P.tries===0 && !P.hint) good(); else { P.streak=0; markDone(it); }
    document.getElementById("streak").textContent=P.streak>=3?"🔥 "+P.streak+" i rad":"";
    const showForm = norm(v)!==norm(it.a) ? `<div style="margin-top:4px">Facit: <b>${esc(it.show)}</b></div>` : (it.show!==it.a?`<div style="margin-top:4px">${esc(it.show)}</div>`:"");
    feedback("good",(P.tries===0&&!P.hint)?cheer():"Voilà ! Nu sitter den.",showForm);
    document.getElementById("qcard").classList.add("pop");
    say(it.a); nextBtn(); return;
  }
  P.tries++; P.streak=0; document.getElementById("streak").textContent="";
  if(P.tries===1) requeue();
  if(r==="acc") feedback("near","Presque !",`Nästan rätt – kolla accenterna. Tips: håll inne en bokstav på iPhone, eller använd knapparna. Prova igen!`);
  else if(r==="art") feedback("near","Presque !",`Rätt ord – men skriv med <b>le / la / l'</b> framför. Prova igen!`);
  else if(P.tries>=2) { reveal("wrong", v); return; }
  else feedback("bad",pickOne(["Mince !","Oups !","Pas grave !"]),`<span class="yours">${esc(v)}</span> – inte riktigt. Testa en gång till (eller tryck 💡).`);
  inp.select();
}
function lockBtns(){["hintB","showB","chkB"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true;}); const a=document.querySelector(".accents"); if(a) a.hidden=true;}

  document.getElementById("showB").disabled=true; document.getElementById("hintB").disabled=true;
}

function finish(pane){
  if(P.mode==="mix"){
    const p=Math.round(P.right/P.total*100);
    pane.innerHTML=`<div class="card finish"><div style="font-size:54px">${p>=80?"🏆":p>=50?"👍":"💪"}</div><div class="big">${P.right} av ${P.total}</div><p>${p>=80?"Magnifique ! Du är redo för provet.":p>=50?"Bien ! Öva lite mer på det som var svårt.":"Courage ! Gå igenom delarna en gång till."}</p>
      <div class="actions"><button class="btn primary" id="again">Ett förhör till</button><button class="btn" id="home">Till översikten</button></div></div>`;
    if(p>=80) burst();
    document.getElementById("again").onclick=startMix; document.getElementById("home").onclick=goHome; return;
  }
  const sec=P.sec, [a,b]=secCount(sec), all=totals();
  const allDone=all[0]===all[1];
  pane.innerHTML=`<div class="card finish"><div style="font-size:54px">${allDone?"🏆":"🎉"}</div><div class="big">${allDone?"TOUT EST FINI !":"Bravo !"}</div>
    <p>${allDone?"Du har klarat ALLT inför provet. Bonne chance ! 🇫🇷":`${esc(sec.t)} är klar (${a}/${b}). ${pickOne(["Le perroquet est fier de toi 🦜","Même Alexandre n'est pas en retard aujourd'hui !","Tu n'es pas fatigué(e) ?","Ça suffit … nej, kör en till!"])}`}</p>
    <div class="actions"><button class="btn primary" id="nx">${allDone?"Blandat förhör":"Nästa del →"}</button><button class="btn" id="home">Till översikten</button></div></div>`;
  burst("confetti",allDone?260:140);
  if(allDone) setTimeout(()=>burst("confetti",200),700);
  document.getElementById("home").onclick=goHome;
  document.getElementById("nx").onclick=()=>{ if(allDone) startMix(); else { const n=nextSection(); n?openSec(n.id):goHome(); } };
}

/* ---- texts ---- */
function renderTexts(sec){
  const t=TX.find(x=>x.id===view.text);
  const r=st.reads[t.id]||0;
  let h=`<div class="sechead"><h2>Läs texterna</h2><p>Läs högt, tryck på en mening för att se svenskan. Markera när du har läst hela texten.</p></div>
   <div class="textpick">${TX.map(x=>`<button aria-pressed="${x.id===t.id}" data-t="${x.id}">${x.name} ${(st.reads[x.id]||0)>=READS?"✓":""}</button>`).join("")}</div>
   <div class="readbox"><div><b style="font-family:var(--f-display);font-size:20px">${esc(t.title)}</b><div class="dots" aria-label="${r} av ${READS} läsningar">${[1,2,3].map(i=>`<i class="${i<=r?"on":""}"></i>`).join("")}</div></div>
   ${canSpeak?`<button class="btn" id="playAll" style="padding:8px 12px">🔊 Lyssna</button>`:""}</div>
   <div class="toolrow"><span></span><button class="link" id="svAll">Visa all svenska</button></div>
   <div class="dlg">${t.lines.map((l,i)=>`<button class="ln${l[0]?"":" narr"}" data-i="${i}"><span class="who">${esc(l[0])}</span><span class="f">${esc(l[1])}</span><span class="sv2" hidden>${esc(l[2])}</span></button>`).join("")}</div>
   <div class="actions" style="grid-template-columns:1fr"><button class="btn ${r>=READS?"":"green"}" id="readB">${r>=READS?"✓ Läst 3 gånger – läs gärna igen":"✓ Jag har läst texten ("+(r+1)+"/"+READS+")"}</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{view.text=b.dataset.t;renderTexts(sec);});
  app.querySelectorAll(".ln").forEach(b=>b.onclick=()=>{
    const l=t.lines[+b.dataset.i]; const s=b.querySelector(".sv2"); s.hidden=!s.hidden;
    if(!s.hidden) say(l[1]);
    if(l[3]==="boom"){ document.body.classList.remove("shake"); void document.body.offsetWidth; document.body.classList.add("shake"); burst("boom",40); egg("chimie","💥 BOUM ! Ils ont chimie aujourd'hui …<br>Papegojorna borde nog inte blanda fler vätskor."); }
  });
  const sa=document.getElementById("svAll"); sa.onclick=()=>{const anyHidden=app.querySelector(".sv2[hidden]");app.querySelectorAll(".sv2").forEach(s=>s.hidden=!anyHidden);sa.textContent=anyHidden?"Dölj svenskan":"Visa all svenska";};
  const pa=document.getElementById("playAll"); if(pa) pa.onclick=()=>{ try{speechSynthesis.cancel(); t.lines.forEach(l=>{const u=new SpeechSynthesisUtterance(l[1]);u.lang="fr-FR";if(frVoice)u.voice=frVoice;u.rate=.85;speechSynthesis.speak(u);});}catch(e){} };
  document.getElementById("readB").onclick=()=>{
    const cur=st.reads[t.id]||0;
    if(cur>=READS){ toast("Encore ! Ju fler gånger desto bättre 📖"); return; }
    st.reads[t.id]=cur+1; save(); renderHeader();
    if(cur+1===READS){ burst(); toast(`Texten ${t.name} är klar ! 📖✓`); const nx=TX.find(x=>(st.reads[x.id]||0)<READS); if(nx) view.text=nx.id; }
    else toast(`Bien ! ${cur+1} av ${READS} gånger`);
    renderTexts(sec); scrollTo(0,0);
  };
}

function goHome(){ view={name:"home"}; renderHeader(); renderHome(); scrollTo(0,0); }
document.getElementById("backBtn").onclick=goHome;

/* parrot logo egg */
let taps=0,tapT;
document.getElementById("logo").onclick=()=>{
  taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1500);
  say(taps<5?"Bonjour !":"");
  if(taps>=5){ taps=0;
    if(!reduce){const f=document.createElement("div");f.className="flyer";f.innerHTML=`🦜<div class="bub">Quelle heure est-il ? … Je ne sais pas, je n'ai pas mes lunettes !</div>`;document.body.appendChild(f);setTimeout(()=>f.remove(),3700);}
    say("Quelle heure est-il ? Je ne sais pas. Je n'ai pas mes lunettes !");
    egg("perroquet","🦜 Le perroquet s'envole ! Han letar efter sina lunettes …");
  }
};

/* late-night egg */
(function(){const h=new Date().getHours(); if(h>=22||h<5) setTimeout(()=>egg("tard","😴 Il est tard ! Tu es fatigué(e) ?<br>Alexandre också … men han är ju alltid sen."),1200);})();

renderHeader(); renderHome();
</script>
